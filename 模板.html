/* ---- 全站「看一眼」（S1-10 S2-11；作者 10-01：「我觉得这个预览功能应该全站可用才对啊」）：
   哪一页上写着项目里的文件路径（说明、计划、交付单、卡片里 `这样写的路径`），点一下弹出来看；跟模块页同一套预览，Esc 关 */
async function peekOpen(path) {
  let p;
  try { p = await api('GET', 'api/project/preview?path=' + encodeURIComponent(path)); }
  catch (e) { toast('看不了「' + path + '」：' + e.message); return; }
  let d = document.getElementById('peekdlg');
  if (!d) { d = document.createElement('dialog'); d.id = 'peekdlg'; document.body.appendChild(d); }
  const url = purl(path);
  d.innerHTML = '<div class="pkhead"><span class="path" title="' + esc(path) + '">' + esc(path) + '</span><span class="hint">' + fmtSize(p.size) + ' · ' + fmtTime(p.mtime) + '</span>'
    + '<button class="sbtn sticky-shortcut" data-pkcite aria-label="便签 Sticky note" title="便签 Sticky note">' + stickyNoteIcon() + '便签 <span class="en">Sticky note</span></button><button class="sbtn" data-pvfull>全屏</button><a class="sbtn" href="' + url + '" target="_blank" rel="noopener">新标签打开</a><button class="sbtn" data-pkclose>关（Esc）</button></div>'
    + '<div class="pkbody">' + (p.error ? '<div class="empty">' + esc(p.error) + '</div>' : pvWrap(previewBody(p, url, path).body, path)) + '</div>';
  d.dataset.path = path;
  if (!d.open) d.showModal();
}
document.addEventListener('click', function (e) {
  const k = e.target.closest('[data-peek]');
  if (k) { e.preventDefault(); peekOpen(k.dataset.peek); return; }
  const d = document.getElementById('peekdlg');
  if (!d || !d.open) return;
  if (e.target.closest('[data-pkclose]') || e.target === d) d.close();
  else if (e.target.closest('[data-pkcite]')) { appendNote('关于「' + d.dataset.path + '」：'); d.close(); }
});
function pathish(t) {                          // `工具库/下载/清单.md` 这种：像项目里的文件路径（不以 / 开头、不带空格和尖括号、有扩展名）
  return !/^[\/~]|[\s<>|*?:]|^https?/.test(t) && /\.[A-Za-z0-9]{1,8}$/.test(t) && (t.indexOf('/') > 0 || /^[^/]+\.(md|html|pdf|zip|json|js|py|css|txt|csv|docx|xlsx|pptx|png|jpg)$/i.test(t));
}
function renderMd(src, documentPath) {
  const L = src.replace(/\r\n?/g, '\n').split('\n');
  const inline = function (t) {
    return esc(t)
      .replace(/!\[([^\]]*)\]\(((?:https?:|笔记\/)[^)\s]+)\)/g, function (_, alt, u) {
        const web = /^https?:/.test(u), src = web ? u : purl(u, BUST[u]);
        return '<a href="' + src + '" target="_blank" rel="noopener"><img class="nimg' + (/^录屏画面/.test(alt) ? ' nframe' : '')
          + '" src="' + src + '" alt="' + alt + '"' + (web ? '' : ' data-path="' + u + '"') + '></a>';
      })
      .replace(/\[([^\]]+)\]\((笔记\/[^)\s]+\.(?:mp4|webm|mov))\)/gi, function (_, label, u) {
        return '<video class="nvid" controls preload="metadata" src="' + purl(u) + '"></video>';
      })
      .replace(/`([^`]+)`/g, function (_, c) { const raw = c.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'"); return pathish(raw) ? '<code class="plink" data-peek="' + esc(raw) + '" title="看一眼">' + c + '</code>' : '<code>' + c + '</code>'; })
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  };
  const originalInline = inline;
  const localReferences = function (text) {
    const rendered = originalInline(text);
    if (!documentPath) return rendered;
    return rendered.replace(/\[([^\]]+)\]\((?:&lt;)?([^)]*?)(?:&gt;)?\)/g, function (whole, label, rel) {
      rel = rel.replace(/&gt;$/, '');
      if (!rel || /^[\/#]|^[a-z][a-z0-9+.-]*:|[\\<>]/i.test(rel) || rel.includes('&')) return whole;
      const parts = documentPath.split('/').slice(0, -1);
      for (const part of rel.split('#')[0].split('/')) { if (part === '..') { if (!parts.length) return whole; parts.pop(); } else if (part && part !== '.') parts.push(part); }
      const target = parts.join('/');
      return target ? '<a class="plink" href="#" data-peek="' + esc(target) + '">' + label + '</a>' : whole;
    });
  };
  const cells = function (r) { return r.trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); }); };
  const block = /^(#{1,6}\s|```|>|\s*([-*+]|\d+[.)])\s|\s*\|)/;
  let h = '', i = 0, m;
  while (i < L.length) {
    const l = L[i];
    if (/^```/.test(l)) {
      const code = []; i++;
      while (i < L.length && !/^```/.test(L[i])) code.push(L[i++]);
      i++; h += '<pre class="pv">' + esc(code.join('\n')) + '</pre>'; continue;
    }
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { h += '<h' + m[1].length + '>' + localReferences(m[2]) + '</h' + m[1].length + '>'; i++; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { h += '<hr>'; i++; continue; }
    if (/^>/.test(l)) {
      const q = [];
      while (i < L.length && /^>/.test(L[i])) q.push(L[i++].replace(/^>\s?/, ''));
      h += '<blockquote>' + q.map(localReferences).join('<br>') + '</blockquote>'; continue;
    }
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < L.length && /^\s*\|?\s*:?-{2,}/.test(L[i + 1])) {
      const head = cells(l); let body = ''; i += 2;
      while (i < L.length && /^\s*\|.*\|\s*$/.test(L[i])) body += '<tr>' + cells(L[i++]).map(function (c) { return '<td>' + localReferences(c) + '</td>'; }).join('') + '</tr>';
      h += '<table><thead><tr>' + head.map(function (c) { return '<th>' + localReferences(c) + '</th>'; }).join('') + '</tr></thead><tbody>' + body + '</tbody></table>';
      continue;
    }
    if ((m = l.match(/^\s*([-*+]|\d+[.)])\s+/))) {
      const ol = /\d/.test(m[1]); let items = '';
      while (i < L.length && (m = L[i].match(/^\s*([-*+]|\d+[.)])\s+(.*)$/))) { items += '<li>' + localReferences(m[2]) + '</li>'; i++; }
      h += (ol ? '<ol>' : '<ul>') + items + (ol ? '</ol>' : '</ul>'); continue;
    }
    if (!l.trim()) { i++; continue; }
    const para = [l]; i++;
    while (i < L.length && L[i].trim() && !block.test(L[i])) para.push(L[i++]);
    h += '<p>' + para.map(localReferences).join('<br>') + '</p>';
  }
  return h;
}

/* ================= 外部资料入口 Intake：外面的材料从这进 =================
   拖进来先放 资料/_外部资料入口/；agent 给候选（高/中/低 + 理由），人点一个才放进模块。
   页面上任何地方松手都算放进外部资料入口——拖到它的标签上也行。 */
let INB = [];
function showInbox() {
  if (S) document.title = '外部资料入口 · ' + S.project.name;
  const v = $('#inboxview');
  if (!v.dataset.built) {
    v.dataset.built = 1;
    v.innerHTML = '<h1>外部资料入口 <span class="en">Intake</span></h1>'
      + '<div class="sub">外面的材料扔进来，先放在 资料/_外部资料入口/。agent 给几个候选，你点一个才放进模块；一模一样的文件只存一份。</div>'
      + '<label class="drop" id="drop"><b>把文件或整个文件夹拖到这里</b>也可以点这里选文件<input type="file" id="pick" multiple hidden></label>'
      + '<div class="ph2"><button class="sbtn" id="sortPrompt">生成分拣指令</button> <span class="hint" id="inbHint"></span></div>'
      + '<div id="icards"></div>';
    $('#pick').onchange = function () {
      upload(Array.from(this.files).map(function (f) { return { file: f, path: f.name }; }));
      this.value = '';
    };
    $('#sortPrompt').onclick = async function () {
      if (!INB.length) { toast('外部资料入口是空的'); return; }
      const c = CMDS.find(function (x) { return x.en === 'sort-intake'; });   // 用快捷指令「分拣外部资料」，一份定义
      const t = c ? await fillCommand(c.body) : sortingPrompt(), ok = await copyText(t);
      if (online) { try { await api('POST', 'api/note/export', { text: t }); } catch (e) {} }
      toast(ok ? '分拣指令已复制，粘给 agent' : '没复制上，但已存进库：让 agent 调 read_notes');
    };
  }
  loadInbox();
}
async function loadInbox() {
  if (!online) { $('#icards').innerHTML = '<div class="empty">没连后端，看不到。双击「启动.bat」再打开。</div>'; return; }
  try { INB = (await api('GET', 'api/inbox')).items; } catch (e) { toast(e.message); return; }
  renderCards();
}
function renderCards() {
  const box = $('#icards');
  if (!box) return;
  $('#inbHint').textContent = INB.length ? '待分拣 ' + INB.length + ' 个' : '';
  setToc('资料/_外部资料入口/ · ' + INB.length + ' 个', INB.map(function (it) {
    return { id: 'ic-' + it.id, label: it.name, meta: fmtSize(it.size) + ' · ' + fmtTime(it.created_at) };
  }), '空的：把文件拖进网页');
  if (!INB.length) { box.innerHTML = '<div class="empty">外部资料入口是空的。</div>'; return; }
  const mods = '<optgroup label="资料里的模块">' + S.modules.map(function (m) { return '<option>' + esc(m.name) + '</option>'; }).join('') + '</optgroup>';
  const OSS = '工具/开源项目';                   // 内置的「工具」也是去向（作者 10-01：「为啥外部资料入口的东西不能直接分配到工具？」「分类的地方要多加一个底层的工具模块」）
  box.innerHTML = INB.map(function (it) {
    const zip = /\.zip$/i.test(it.name);
    const tools = '<optgroup label="内置 · 工具"><option value="' + OSS + '"' + (zip ? ' selected' : ' disabled') + '>工具 · 开源项目' + (zip ? '（GitHub 压缩包）' : '（只收 GitHub 下载的 .zip）') + '</option></optgroup>';
    const opts = zip ? tools + mods : mods + tools;
    return '<div class="icard" id="ic-' + it.id + '" data-id="' + it.id + '"><div class="nm">' + esc(it.name) + '</div>'
      + '<div class="meta">' + fmtSize(it.size) + ' · ' + fmtTime(it.created_at) + ' · ' + esc(who(it.created_by)) + '放进来的'
      + (it.orig !== it.name ? ' · 原来是 ' + esc(it.orig) : '') + '</div>'
      + (it.candidates.length ? it.candidates.map(function (c) {
          return '<div class="cand"><span class="mod">' + esc(c.module) + (c.folder ? ' / ' + esc(c.folder) : '') + '</span>'
            + '<span class="conf conf-' + esc(c.conf) + '">把握 ' + esc(c.conf) + '</span>'
            + '<span class="why">' + esc(c.reason) + '</span><span class="who">' + esc(who(c.by)) + '</span>'
            + '<button class="sbtn" data-put="' + esc(c.module) + '" data-folder="' + esc(c.folder || '') + '">放这里</button></div>';
        }).join('') : '<p class="hint">还没有候选：等 agent 看过给建议，或点上面「生成分拣指令」。</p>')
      + '<div class="own">都不对，我自己选：<select data-own-mod>' + opts + '</select><select data-own-folder><option value="">（模块根目录 Module root）</option></select><button class="sbtn" data-own>放进去</button></div>'
      + '<div class="ipeekbar"><button class="sbtn" data-peek="资料/_外部资料入口/' + esc(it.name) + '">看一眼</button></div></div>';
  }).join('');
}
$('#inboxview').addEventListener('click', function (e) {
  const b = e.target.closest('[data-put],[data-own]');
  if (!b) return;
  const card = b.closest('.icard'), it = INB.find(function (x) { return String(x.id) === card.dataset.id; });
  sortItem(it, b.dataset.put || card.querySelector('[data-own-mod]').value, b.dataset.put ? (b.dataset.folder || '') : card.querySelector('[data-own-folder]').value);
});
/* 自己选的时候，选了模块再挑模块里的文件夹（作者 10-07：「资料入口可以分配到具体模块的具体文件夹」） */
async function inboxFolders(card) {
  const mod = card.querySelector('[data-own-mod]'), sel = card.querySelector('[data-own-folder]');
  if (!mod || !sel) return;
  sel.innerHTML = '<option value="">（模块根目录 Module root）</option>';
  if (mod.value === '工具/开源项目') { sel.disabled = true; return; }
  sel.disabled = false;
  try {
    const d = await api('GET', 'api/inbox/folders?module=' + encodeURIComponent(mod.value));
    if (mod.value !== d.module) return;
    sel.innerHTML += d.folders.map(function (f) { return '<option value="' + esc(f) + '">' + esc(f) + '</option>'; }).join('');
  } catch (e) { toast(e.message); }
}
$('#inboxview').addEventListener('change', function (e) {
  if (e.target.matches('[data-own-mod]')) inboxFolders(e.target.closest('.icard'));
});
new MutationObserver(function () {
  document.querySelectorAll('#inboxview .icard').forEach(function (card) {
    if (!card.dataset.foldersRead) { card.dataset.foldersRead = '1'; inboxFolders(card); }
  });
}).observe($('#inboxview'), { childList: true, subtree: true });
async function sortItem(it, module, folder) {
  folder = folder || '';
  if (module === '工具/开源项目') {
    try {
      const r = await api('POST', 'api/inbox/' + it.id + '/oss');
      INB = r.items; renderCards();
      act(ACT.sorted, it.name + ' → ' + r.repo.code + ' ' + r.repo.name);
      toast('放进开源项目：' + r.repo.code + ' ' + r.repo.name + '（' + (r.repo.license || '没许可证') + ' · ' + r.repo.borrow + '）');
    } catch (e) { toast(e.message); }
    return;
  }
  try {
    INB = (await api('POST', 'api/inbox/' + it.id + '/sort', { module: module, folder: folder })).items;
    renderCards();
    act(ACT.sorted, it.name + ' → ' + module + (folder ? '/' + folder : ''));
    toast('已放进 资料/' + module + '/' + (folder ? folder + '/' : ''));
  } catch (e) { toast(e.message); }
}
function sortingPrompt() {
  const L = ['# 给 agent 的指令：分拣外部资料入口', '',
    '项目：' + S.project.name + '（' + S.project.root + '）',
    '外部资料入口 资料/_外部资料入口/ 里有 ' + INB.length + ' 个文件等分拣。', '',
    '请用 MCP 工具（research-console）：先 list_inbox 看每个文件（需要时自己打开文件读内容），'
    + '再对每个文件调 suggest_sorting，给 1~3 个候选模块，按把握从高到低，每个写「高/中/低」和一句让人一看就能判断的理由，不要写百分比。',
    '候选只能是现有模块：' + S.modules.map(function (m) { return m.name; }).join('、') + '。觉得需要新模块，先用 ask_human 问我。',
    '不要自己挪文件，我在网页上点了才挪。', '', '## 文件'];
  INB.forEach(function (it) { L.push('- #' + it.id + ' ' + it.name + '（' + fmtSize(it.size) + '）'); });
  return L.join('\n') + '\n';
}
async function upload(list) {
  if (!list.length) return;
  if (!online) { toast('没连后端，收不了。先双击「启动.bat」'); return; }
  const fd = new FormData();
  list.forEach(function (x) { fd.append('files', x.file, x.path || x.file.name); });
  toast('正在收 ' + list.length + ' 个文件…');
  try {
    const r = await fetch('api/inbox', { method: 'POST', body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || '没收成');
    d.added.forEach(function (n) { act(ACT.dropped, n); });
    toast('收到 ' + d.added.length + ' 个' + (d.dup.length ? '；' + d.dup.length + ' 个跟已有的一模一样，没存第二份' : ''));
    if (view !== 'inbox') location.hash = '#/inbox'; else loadInbox();
  } catch (e) { toast(e.message); }
}
/* 拖进来的可能是整个文件夹：一层层读出里面的文件。
   注意：webkitGetAsEntry 必须在 drop 当下同步取，await 之后就拿不到了 */
async function filesFromDrop(dt) {
  const entries = Array.from(dt.items || []).map(function (i) { return i.webkitGetAsEntry && i.webkitGetAsEntry(); }).filter(Boolean);
  const out = [];
  if (!entries.length) { Array.from(dt.files).forEach(function (f) { out.push({ file: f, path: f.name }); }); return out; }
  async function walk(e) {

/* ================= 问答 Q&A：待你判断（D-）· 答疑（Q）· 决定（A-），你和 agent 的一问一答一页看全 ================= */
/* 作者 2026-09-25：「违规变成问答？」——违规也是一种要你判断的事，以后查出来的也进「待你判断」 */
let QA = null, QASEL = null;
function qaFields(lines) {
  return lines.map(function (l) { const i = l.indexOf('：'); return '<div><span class="fk">' + esc(l.slice(0, i + 1)) + '</span>' + esc(l.slice(i + 1)) + '</div>'; }).join('');
}
async function showQA() {
  if (S) document.title = '问答 · ' + S.project.name;
  const v = $('#qaview');
  if (!online) { v.innerHTML = '<div class="empty">没连后端，看不到。</div>'; setToc('问答', [], ''); return; }
  const old = v.querySelector('textarea'), typed = old ? old.value : '';        // 重画别冲掉你正在写的拍板
  try { QA = await api('GET', 'api/qa'); } catch (e) { toast(e.message); return; }
  const keys = ['h:新'].concat(QA.pending.map(function (p) { return 'd:' + p.code; }),
    QA.answers.map(function (q) { return 'q:' + q.code; }), QA.decisions.map(function (d) { return 'a:' + d.code; }),
    QA.asked.map(function (q) { return 'h:' + q.code; }));
  if (keys.indexOf(QASEL) < 0) QASEL = keys[1] || keys[0];
  const open = QA.asked.filter(function (q) { return !q.closed_at; }), done = QA.asked.filter(function (q) { return q.closed_at; });
  function row(key, label, meta) {
    return '<div class="row' + (key === QASEL ? ' on' : '') + '" data-qa="' + esc(key) + '"><span class="nm" title="' + esc(label) + '">' + esc(label) + '</span>'
      + (meta ? '<span class="meta">' + esc(meta) + '</span>' : '') + '</div>';
  }
  $('#toc').innerHTML = '<div class="qah">agent 问你</div><div class="h">待你判断 · ' + QA.pending.length + '</div>'
    + (QA.pending.map(function (p) { return row('d:' + p.code, p.code + ' ' + p.text, who(p.created_by)); }).join('') || '<div class="none">没有</div>')
    + '<div class="h">答疑 · 自动化/答疑/</div>'
    + (QA.answers.map(function (q) { return row('q:' + q.code, q.code + ' ' + (q.fields['问题'] || ''), q.result); }).join('') || '<div class="none">还没有</div>')
    + '<div class="h">决定 · ' + QA.decisions.length + '</div>'
    + (QA.decisions.map(function (d) { return row('a:' + d.code, d.code + ' ' + d.text, fmtTime(d.created_at)); }).join('') || '<div class="none">还没有</div>')
    + '<div class="qah">你问 agent</div>' + row('h:新', '＋ 问 agent', '')
    + '<div class="h">等它答 · ' + open.length + '</div>'
    + (open.map(function (q) { return row('h:' + q.code, q.code + ' ' + q.text, fmtTime(q.created_at)); }).join('') || '<div class="none">没有</div>')
    + '<div class="h">答了 · ' + done.length + '</div>'
    + (done.map(function (q) { return row('h:' + q.code, q.code + ' ' + q.text, q.answer ? who(q.answer.created_by) : ''); }).join('') || '<div class="none">还没有</div>');
  let body = '<h1>问答 <span class="en">Q&amp;A</span></h1>';
  const kind = QASEL ? QASEL[0] : '', code = QASEL ? QASEL.slice(2) : '';
  if (kind === 'd') {
    const p = QA.pending.find(function (x) { return x.code === code; });
    body += '<h2>' + esc(p.code) + ' · ' + esc(p.text) + '</h2><p class="hint">' + esc(who(p.created_by)) + ' 问的 · ' + esc(fmtTime(p.created_at)) + '</p>'
      + (p.detail ? '<div class="ask"><div class="ctx">' + esc(p.detail) + '</div></div>' : '')
      + '<div class="ask"><div class="row2"><textarea placeholder="你的决定，写一句就行"></textarea><button class="btn" data-answer="' + esc(p.code) + '">拍板</button></div></div>';
  } else if (kind === 'q') {
    const q = QA.answers.find(function (x) { return x.code === code; });
    body += '<h2>' + esc(q.code) + ' · ' + esc(q.result) + '</h2><p class="hint">' + esc(q.at) + ' · ' + esc(who(q.by)) + '</p>' + qaFields(q.lines);
  } else if (kind === 'a') {
    const d = QA.decisions.find(function (x) { return x.code === code; });
    body += '<h2>' + esc(d.code) + ' · ' + esc(d.text) + '</h2><p class="hint">' + esc(fmtTime(d.created_at)) + '</p>'
      + (d.ref ? '<div><span class="fk">答的是：</span>' + esc(d.ref) + ' ' + esc(d.detail || '') + '</div>' : '');
  } else if (kind === 'h' && code === '新') {
    body += '<h2>问 agent</h2><div class="ask"><textarea id="qaAsk" placeholder="你想问的"></textarea>'
      + '<input id="qaWhere" class="qawhere" placeholder="出处（可空）：在看什么的时候问的"><div class="acts"><button class="btn" data-ask>问</button></div></div>';
  } else if (kind === 'h') {
    const q = QA.asked.find(function (x) { return x.code === code; });
    body += '<h2>' + esc(q.code) + ' · ' + esc(q.text) + '</h2><p class="hint">' + esc(who(q.created_by)) + ' 问的 · ' + esc(fmtTime(q.created_at))
      + (q.detail ? ' · 出处：' + esc(q.detail) : '') + '</p>'
      + (q.answer ? '<div class="qaans"><div class="hint">' + esc(q.answer.code) + ' · ' + esc(who(q.answer.created_by)) + ' · ' + esc(fmtTime(q.answer.created_at)) + '</div>'
        + '<article class="md">' + renderMd(q.answer.text) + '</article><div class="acts"><button class="sbtn" data-qanote="' + esc(q.code) + '">写进笔记</button></div></div>'
        : '<div class="none">等 agent 答：它下一次看全貌时先答这个</div>');
  } else {
    body += '<div class="empty">还没有问答。</div>';
  }
  v.innerHTML = body;
  const t = v.querySelector('textarea');
  if (t && typed) t.value = typed;
}

$('#qaview').addEventListener('click', async function (e) {

    const text = $('#qaAsk').value.trim();

    try {

      toast('问了 ' + q.code + '：agent 下一次看全貌时先答');
      QASEL = 'h:' + q.code; showQA(); load();
    } catch (err) { toast(err.message); }
    return;
  }
  const nb = e.target.closest('[data-qanote]');
  if (nb) {
    const q = QA.asked.find(function (x) { return x.code === nb.dataset.qanote; });
    appendNote('问 ' + q.code + '：' + q.text + '\n答（' + who(q.answer.created_by) + '）：' + q.answer.text);
    return;
  }
  const b = e.target.closest('[data-answer]');
  if (!b) return;
  const text = $('#qaview').querySelector('textarea').value.trim();

  try {

    act(ACT.decided, b.dataset.answer + ' → ' + text);
    toast('已拍板，agent 下次看全貌就知道');
    $('#qaview').querySelector('textarea').value = '';
    QASEL = null; showQA();
  } catch (err) { toast(err.message); }
});

/* ================= 清理 Cleanup：待删请求 + 回收站（项目根 回收站/）。挪进去、还原都是 agent 做，网页只看 ================= */
let TR = null, TRSEL = null;
async function showTrash() {
  if (S) document.title = '清理 · ' + S.project.name;
  const v = $('#trashview');
  if (!online) { v.innerHTML = '<div class="empty">没连后端，看不到。回收站在项目根的 回收站/ 里。</div>'; setToc('清理', [], ''); return; }
  try { TR = await api('GET', 'api/trash'); } catch (e) { toast(e.message); return; }
  try { RB = await api('GET', 'api/rebirth'); } catch (_) { RB = { job: {}, history: [], plans: [] }; }
  const keys = ['tidy', 'arch', 'dig', 'rw', 'rb:backup'].concat(RB.plans.map(function (p) { return 'rb:' + p.path; }), TR.requests.map(function (r) { return 'r:' + r.id; }), TR.items.map(function (x) { return 'x:' + x.code; }));
  if (keys.indexOf(TRSEL) < 0) TRSEL = 'tidy';
  function row(key, label, meta) {
    return '<div class="row' + (key === TRSEL ? ' on' : '') + '" data-tr="' + esc(key) + '"><span class="nm" title="' + esc(label) + '">' + esc(label) + '</span>'
      + (meta ? '<span class="meta">' + esc(meta) + '</span>' : '') + '</div>';
  }
  $('#toc').innerHTML = '<div class="h">整理</div>' + row('tidy', '查乱', '') + row('arch', '归档', '') + row('dig', '摘要', '') + row('rw', '重写', '')
    + '<div class="h">待删请求 · ' + TR.requests.length + '</div>'
    + (TR.requests.map(function (r) { return row('r:' + r.id, r.id + ' ' + r.body, r.scope); }).join('') || '<div class="none">没有</div>')
    + '<div class="h">回收站 · 回收站/</div>'
    + (TR.items.map(function (x) {                   // 一批的写从哪来（复活 C1 换下来的），单件的写文件名
        const one = (x.fields['原来在'] || '').indexOf(' 等 ') < 0;
        return row('x:' + x.code, x.code + ' ' + (one ? (x.fields['原来在'] || '').split('/').pop() : (x.fields['从哪来'] || x.fields['原来在'])), x.status);
      }).join('') || '<div class="none">空的</div>')
    + '<div class="h">重生</div>' + row('rb:backup', '全量备份', rbRunning(RB.job) ? RB.job.state + ' ' + rbPct(RB.job) + '%' : (RB.history[0] ? RB.history[0].state : ''))
    + RB.plans.map(function (p) { return row('rb:' + p.path, p.code + ' ' + p.short, p.state); }).join('');
  if (TRSEL === 'tidy') { showTidy(v); return; }
  if (TRSEL === 'arch') { showArchive(v); return; }
  if (TRSEL === 'dig') { showDigest(v); return; }
  if (TRSEL === 'rw') { showRewrite(v); return; }
  if (TRSEL === 'rb:backup') { showBackup(v); return; }
  if (TRSEL.indexOf('rb:') === 0) { showRbPlan(v, TRSEL.slice(3)); return; }
  const canPurge = function (x) { return x.status === '在回收站'; };   // 10-07：回收站里的都能直接删（确认一次）
  const purgeable = TR.items.filter(canPurge).map(function (x) { return x.code; });
  let body = '<h1>清理 <span class="en">Cleanup</span></h1><div class="sub">回收站在项目根的 回收站/：删模块、复活换下来的、删掉的存档、agent 照删除请求挪的，都在这，'
    + '一件（一批）一个编号。还原、彻底删掉都直接点；彻底删掉会再确认一次，删了收不回来。</div>'
    + (purgeable.length ? '<div class="acts" style="margin:0 0 10px"><span class="hint">回收站里有 ' + purgeable.length + ' 件。</span>'
        + '<button class="sbtn" data-trpurge="' + esc(purgeable.join(',')) + '">全部彻底删掉 <span class="en">Delete all permanently</span></button></div>' : '');
  const kind = TRSEL ? TRSEL[0] : '', code = TRSEL ? TRSEL.slice(2) : '';
  if (kind === 'r') {
    const r = TR.requests.find(function (x) { return x.id === code; });
    body += '<h2>' + esc(r.id) + ' · 删除请求</h2><p class="hint">记在「' + esc(r.scope) + '」的笔记本 · ' + esc(r.at) + ' · ' + esc(who(r.by)) + '</p>'
      + '<article class="md">' + renderMd(r.body) + '</article>'
      + '<div class="acts"><button class="sbtn" data-note="请照 ' + esc(r.id) + ' 删：用 move_to_trash 挪进 回收站/，request 填 ' + esc(r.id) + '。">放进笔记：请照这条删</button></div>';
    v.innerHTML = body;
    return;
  }
  if (kind === 'x') {
    const x = TR.items.find(function (i) { return i.code === code; });
    const inBin = x.status === '在回收站';
    body += '<h2>' + esc(x.code) + ' · ' + esc(x.status) + '</h2><p class="hint">' + esc(x.at) + ' · ' + esc(who(x.by)) + ' 挪的</p>'
      + Object.keys(x.fields).map(function (k) { return '<div><span class="fk">' + esc(k) + '：</span>' + esc(x.fields[k]) + '</div>'; }).join('')
      + (inBin ? '<div class="acts" style="margin:10px 0"><button class="sbtn" data-trrestore="' + esc(x.code) + '">还原</button>'
        + '<button class="sbtn" data-trpurge="' + esc(x.code) + '">彻底删除 <span class="en">Permanently delete</span></button></div>' : '')
      + '<div id="trpv"></div>';
    v.innerHTML = body;
    if (inBin && x.fields['放在']) {                  // 能预览就预览；是文件夹的话说一声
      const path = x.fields['放在'];
      try {
        const p = await api('GET', 'api/project/preview?path=' + encodeURIComponent(path));
        $('#trpv').innerHTML = previewBody(p, 'pfiles/' + path.split('/').map(encodeURIComponent).join('/'), path).body;
      } catch (_) { $('#trpv').innerHTML = '<p class="hint">这是个文件夹（或看不了的文件），在「全站检索」左边能展开看。</p>'; }
    }
    return;
  }
  v.innerHTML = body + '<div class="empty">没有待删的，回收站也是空的。</div>';
}
/* 清理 → 查乱 · 归档（S1-8 S2-61；作者 10-03「清理模块不光得有垃圾桶的功能，还得有重铸的功能，因为ai编程很多信息是重复杂乱的……
   相当于上下文压缩了」）：查乱只读、现算；归档整份搬进 归档/年-月/，带索引，能拿回来。说明写在使用说明里 */
const TDK = { dup: '重复', stale: '能归档', unused: '没人用的程序', long: '太长的正本', numbers: '计划重号' };
async function showTidy(v, fresh) {
  v.innerHTML = '<h1>查乱 <span class="en">Tidy check</span></h1><div class="hint">查着…</div>';
  let d;
  try { d = await api('GET', 'api/tidy' + (fresh ? '?fresh=1' : '')); } catch (e) { toast(e.message); return; }
  if (TRSEL !== 'tidy' || view !== 'trash') return;
  const c = d.counts, peek = function (f, line) { return '<a data-peek="' + esc(f) + '">' + esc(f) + '</a>' + (line ? ' 第 ' + line + ' 行' : ''); };
  const sec = function (k, body) { return '<h2 id="td-' + k + '">' + TDK[k] + ' <span class="n">' + c[k] + '</span></h2>' + (c[k] ? body : '<p class="hint">没有</p>'); };
  v.innerHTML = '<h1>查乱 <span class="en">Tidy check</span></h1><div class="sub">' + esc(d.at) + ' 查的 · ' + d.took + ' 秒 <button class="sbtn" data-tdrun>现在查一遍</button></div>'
    + '<div class="tdcards">' + Object.keys(TDK).map(function (k) { return '<a data-tdgo="' + k + '"><b>' + c[k] + '</b>' + TDK[k] + '</a>'; }).join('') + '</div>'
    + sec('dup', d.dup.map(function (x) {
      return '<div class="tdpair"><span class="sim">' + Math.round(x.same * 100) + '%</span>' + peek(x.a.file, x.a.line) + ' ↔ ' + peek(x.b.file, x.b.line)
        + '<div class="q">' + esc(x.a.text) + '</div><div class="q">' + esc(x.b.text) + '</div></div>';
    }).join(''))
    + sec('stale', '<p class="hint">' + Object.keys(d.stale_kinds).map(function (k) { return esc(k) + ' ' + d.stale_kinds[k].count + ' 份（' + fmtSize(d.stale_kinds[k].size) + '）'; }).join(' · ')
      + ' <button class="sbtn" data-tr="arch">去归档</button></p>')
    + sec('unused', '<ul class="svlines">' + d.unused.map(function (u) { return '<li>' + peek(u.file) + ' <span class="hint">' + u.lines + ' 行 · ' + esc(u.at) + '</span></li>'; }).join('') + '</ul>')
    + sec('long', '<ul class="svlines">' + d.long.map(function (u) { return '<li>' + peek(u.file) + ' <span class="hint">' + fmtSize(u.size) + '</span></li>'; }).join('') + '</ul>')
    + sec('numbers', '<ul class="svlines">' + d.numbers.map(function (u) { return '<li><b>' + esc(u.goal + ' ' + u.code) + '</b>：' + u.files.map(function (f) { return peek(f); }).join('、') + '</li>'; }).join('') + '</ul>');
}

function renderSvChange(m, d) {
  const box = $('#svChange');
  if (!box) return;
  const picks = m.mode === '全量' ? null : m.picks, inScope = function (p) { return svIn(p, picks); };
  const groups = {};
  function put(path, kind) { const top = path.split('/')[0]; (groups[top] = groups[top] || []).push({ path: path, kind: kind }); }
  const ch = d.changed.filter(function (x) { return inScope(x.path); }), rm = d.removed.filter(function (x) { return inScope(x.path); });
  const ad = d.added.filter(inScope);
  ch.forEach(function (x) { put(x.path, '改了'); }); rm.forEach(function (x) { put(x.path, '删了'); }); ad.forEach(function (x) { put(x, '新加'); });
  if (!ch.length && !rm.length && !ad.length) { box.innerHTML = '<b>从这一档到现在，存的这些文件一个没变。</b>'; return; }
  box.innerHTML = '<b>从这一档到现在：改了 ' + ch.length + ' 个 · 删了 ' + rm.length + ' 个 · 新加 ' + ad.length + ' 个</b>'
    + Object.keys(groups).sort().map(function (top) {
      const xs = groups[top];
      return '<details class="svgrp"><summary>' + esc(top) + ' <span class="meta">' + xs.length + ' 个</span></summary><div class="svlist">'
        + xs.slice(0, 300).map(function (x) {
          return '<div><span class="tag">' + x.kind + '</span> <span class="p">' + esc(x.path) + '</span>'
            + (x.kind !== '新加' ? '<a data-svpv="' + esc(x.path) + '">看那时候</a><a data-svback="' + esc(x.path) + '">只回这个</a>' : '') + '</div>';
        }).join('') + '</div></details>';
    }).join('');
}

  if (e.target.closest('[data-guide-check]') && guide) { await checkGuide(guide); return; }
  if (e.target.closest('[data-guide-note]') && guide) { appendNote('关于「' + guide.name + '」（' + guideSelection(guide).path + '）：'); return; }
  if(e.target.closest('[data-add-tool]')){openToolDialog();return;}
  const go = e.target.closest('[data-tool]');
  if (go) { pickTool(go.dataset.tool); return; }
  if (e.target.closest('[data-copyconf]') && TMCP) {
    try { await navigator.clipboard.writeText(JSON.stringify(TMCP, null, 2)); toast('复制了：贴进那家 agent 的 MCP 设置'); } catch (err) { toast('复制不了：' + err.message); }
    return;
  }
  const gt = e.target.closest('[data-gtool]');
  if (gt && gt.dataset.gtool) { pickTool('g:' + gt.dataset.gtool); return; }
  const pon = e.target.closest('[data-pon]'), x = TP.find(function (y) { return 'p:' + y.name === TLSEL; });
  if (pon && x) {
    try { await api('POST', 'api/plugins/' + encodeURIComponent(x.name) + '/enable', { on: pon.dataset.pon === '1' }); if (view === 'tools') toast((pon.dataset.pon === '1' ? '启用了 ' : '停用了 ') + x.name); }
    catch (err) { toast(err.message); }
    showTools();
    return;
  }
  if (e.target.closest('[data-precheck]')) {
    try { TP = await api('GET', 'api/plugins?recheck=1'); } catch (err) { toast(err.message); }
    renderTools();
    return;
  }
  const t = TL.find(function (y) { return y.code === TLSEL; });
  if (!t) return;
  if (e.target.closest('[data-recheck]')) { checkTool(t.code); return; }
  if (e.target.closest('[data-installed]')) {
    api('POST', 'api/tools/' + encodeURIComponent(t.code) + '/installed')
      .then(function (r) { if (view === 'tools') toast('装好了：' + t.code + ' ' + (r.version || '')); delete TLCHK[t.code]; showTools(); })
      .catch(function (err) { toast(err.message); });
    return;
  }
  if (e.target.closest('[data-use]'))
    appendNote((t.kind === '技术栈' ? '关于 ' : '用 ') + t.code + ' ' + t.name + '（工具库/' + t.file + '）：');
});

/* 装技能、装快捷指令共用：那边有不一样的同名 → 先问；你点「确定」才覆盖（旧的先备份） */
async function installThing(url, where, label, done) {
  const w = where === 'project' ? '本项目' : '本机';
  async function go(overwrite) {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ where: where, overwrite: overwrite }) });
    const d = await r.json();
    if (r.status === 409 && !overwrite) {
      if (confirm(tr(w + '已经有一份不一样的「' + label + '」。\n覆盖吗？旧的会先备份到 索引/ 下面，不会丢。'))) return go(true);
      toast('没装，原来那份没动');
      return;
    }
    if (!r.ok) throw new Error(d.detail || '没装成');
    done(d);
    toast(d.already ? w + '已经装着一样的了' : '已装到' + w + (d.backup ? '（旧的已备份）' : ''));
    if (!d.already) act(ACT.installed, label + ' → ' + w);
  }
  try { await go(false); } catch (e) { toast(e.message); }
}

/* 按你现在看的页面把空位填上。{我的笔记} 留空，光标停在最后，你接着写 */
async function fillCommand(body) {
  let intake = '没有';
  if (body.indexOf('{外部资料入口}') >= 0 && online) {
    try {
      const items = (await api('GET', 'api/inbox')).items;
      if (items.length) intake = items.length + ' 个：' + items.map(function (it) { return '#' + it.id + ' ' + it.name; }).join('、');
    } catch (e) {}
  }
  const map = {
    '{项目}': S ? S.project.name : '这个项目',
    '{当前页}': pageLabel(),
    '{当前模块}': cur ? '资料/' + cur + '/' : '（没在看具体模块）',
    '{当前文件}': view === 'mod' && MV.sel ? (MV.sel.charAt(0) === '#' ? cur + ' · ' + MV.sel.replace(/^#[^:]*:?/, '') : shown(MV.sel)) : '（没打开具体文件）',

    '{我的笔记}': '',
  };
  let t = body;
  Object.keys(map).forEach(function (k) { t = t.split(k).join(map[k]); });

}

/* ================= 全站检索：像 VS Code，左边整个项目的目录，右边搜和看 ================= */

      const hold={root:c.root,serial:FILE_DELETE.serial,name:c.name,host:c.host,hash:location.hash,card:c.host.querySelector('[data-file-delete-result]')};FILE_DELETE.hold=hold;await fileDeleteRefreshModule(hold);

/* English：页面画出来以后，把界面上的中文逐个换成英文；画新的东西也跟着换（MutationObserver），所以画页面的代码一行不用改。
   对照表在 界面英文.js：dict 整句对照，parts 带数字的句式。中英成对的标签（中文 <span class="en">English</span>）只留英文。
   不换的：预览里的文件、代码、正在写的笔记（NO_EN）——那是你的内容 */
const HAN = /[\u3400-\u9fff]/;
const NO_EN = '.md, .pv, pre, textarea, iframe, script, style, [data-nt]';
function enStr(s) {
  const k = s.trim();
  if (!k || !HAN.test(k)) return null;
  const U = window.UI_EN || {}, D = U.dict || {};
  if (Object.prototype.hasOwnProperty.call(D, k)) return s.replace(k, D[k]);
  let out = k;
  (U.parts || []).forEach(function (r) { out = out.replace(r[0], r[1]); });

document.getElementById('nidea').onclick = function () { this.classList.toggle('on'); };   // 这条是想法：记下时想法表也多一行
document.getElementById('nsave').onclick = async function () {
  const text = ta.value.trim(), scope = noteScope();
  if (!text && !NIMG.length) { toast('先写点什么'); ta.focus(); return; }
  if (!online) { toast('没连后端，记不进笔记本。先双击「启动.bat」'); return; }
  if (NUP) { toast('图还在传，等一下'); return; }
  try {
    if (NIMG.some(function (x) { return FRAMING.has(x.name); })) { toast('录屏的画面还在抽，等一下'); return; }

    const e = await recordNote(scope, text, '笔记', NIMG.map(function (x) { return x.name; }), idea);
    NIMG = []; renderAtt();

    $('#nidea').classList.remove('on');

/* ---- 截图和录屏（作者 2026-09-27：「参考一下微信的截图或者windows自带的可以截图或者录屏功能的能力」）----
   进来的路：「截图」「录屏」按钮（后台替你按 Win+Shift+S / Win+Shift+R，用系统截图工具）· 全局快捷键（设置 → 截图与录屏）·
   Ctrl+V 贴 · 把图或 mp4 拖进小窗。先放 笔记/截图/.草稿/、笔记/录屏/.草稿/（跟没记下的字一样是草稿）；
   「记下」时跟着这条的编号挪进 笔记/截图/、笔记/录屏/。录屏进来后网页抽 5 张画面放在旁边（agent 大多看不了视频）；
   点截图的小图能画（照微信：框、圈、箭头、画笔、文字、马赛克） */
function purl(path, bust) { return 'pfiles/' + path.split('/').map(encodeURIComponent).join('/') + (bust ? '?v=' + bust : ''); }
const BUST = {};                                   // 画过的图：换个地址，浏览器不拿旧的
let CAP = null;                                    // 正在等的：{kind: 'image' 等你框选 | 'video' 在录屏}
const FRAMING = new Set();                         // 正在抽画面的录屏
let DRAFTKEY = '';                                 // 上次看到的草稿个数：变了才重拉
/* 小窗关着时截的、录的直接记成了一条：提示一句；那条要是录屏，这里抽 5 张画面补上 */
let LASTCAP;
const FRAMETRY = new Set();                        // 这次打开网页已经试过补画面的录屏（抽不出来也只试一次）
function renderCaptured(s) {
  const c = s.last_capture, id = c ? c.id + '@' + c.at : null;
  if (LASTCAP !== undefined && id && id !== LASTCAP) toast(c.kind + '记进了 ' + c.id + '（笔记/' + c.scope + '.md）');
  LASTCAP = id;
  (s.frameless || []).forEach(function (path) {
    if (FRAMETRY.has(path)) return;
    FRAMETRY.add(path);
    extractFrames({ kind: 'video', name: path, path: path, saved: true });
  });
}
function renderDraftBadge(d) {
  const n = d ? d.image + d.video : 0;
  $('#nbadge').textContent = n ? ' · ' + n : '';
  const k = JSON.stringify(d || {});
  if (k !== DRAFTKEY) { DRAFTKEY = k; if (note.classList.contains('open')) loadDrafts(); }
}
async function loadDrafts() {
  if (!online) return;
  let items;
  try { items = (await api('GET', 'api/note/drafts')).items; } catch (e) { return; }
  const old = {};
  NIMG.forEach(function (x) { old[x.name] = x.v; });
  NIMG = items.map(function (x) { x.v = old[x.name]; return x; });
  renderAtt();
  NIMG.forEach(function (x) { if (x.kind === 'video' && !x.frames.length) extractFrames(x); });
}
function clock(sec) {
  if (!sec) return '';
  const t = Math.round(sec), mm = String(Math.floor(t / 60) % 60), ss = String(t % 60).padStart(2, '0');
  return t >= 3600 ? Math.floor(t / 3600) + ':' + mm.padStart(2, '0') + ':' + ss : mm + ':' + ss;
}
function renderAtt() {
  $('#natt').innerHTML = NIMG.map(function (x) {
    const drop = '<button data-nimg="' + esc(x.name) + '">×</button>';
    if (x.kind === 'video') {
      return '<span class="ati vid" data-vid="' + esc(x.name) + '">'
        + (x.frames.length ? '<img src="' + purl(x.frames[0], x.v) + '" alt="">' : '<span class="vph">' + (FRAMING.has(x.name) ? '抽画面…' : '') + '</span>')
        + '<span class="vlen">录屏 ' + clock(x.seconds) + '</span>' + drop + '</span>';
    }
    return '<span class="ati" data-draw="' + esc(x.name) + '"><img src="' + purl(x.path, x.v) + '" alt="">' + drop + '</span>';
  }).join('') + (NUP ? '<span class="ati up"></span>'.repeat(NUP) : '')
    + (CAP ? '<span class="ati wait">' + (CAP.kind === 'image' ? '等你框选…' : '录屏中…') + '<button data-capx>×</button></span>' : '');
  count();
}
function isMedia(f) { return /^(image|video)\//.test(f.type) || /\.(mp4|webm|mov)$/i.test(f.name || ''); }
async function addDraftFile(blob) {
  if (!online) { toast('没连后端，贴不进来'); return; }
  NUP++; renderAtt();
  const fd = new FormData();
  fd.append('file', blob, blob.name || 'screenshot.png');
  try {
    const r = await fetch('api/note/drafts', { method: 'POST', body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || '没传上');
    NIMG.push(d);
    if (d.kind === 'video') extractFrames(d);
  } catch (e) { toast(e.message); }
  NUP--; renderAtt();
}
$('#natt').addEventListener('click', async function (e) {
  if (e.target.closest('[data-capx]')) { api('POST', 'api/note/capture/cancel').catch(function () {}); return; }
  const b = e.target.closest('[data-nimg]');
  if (b) {
    try { NIMG = (await api('POST', 'api/note/drafts/' + encodeURIComponent(b.dataset.nimg) + '/drop')).items; } catch (err) { toast(err.message); }
    renderAtt();
    return;
  }
  const el = e.target.closest('[data-draw], [data-vid]');
  const nm = el && (el.dataset.draw || el.dataset.vid), it = NIMG.find(function (x) { return x.name === nm; });
  if (!it) return;
  if (it.kind === 'image') openDraw(it, -1);
  else if (it.frames.length) openDraw(it, 0);
  else window.open(purl(it.path), '_blank');
});
ta.addEventListener('paste', function (e) {
  const fs = Array.from((e.clipboardData && e.clipboardData.items) || [])
    .filter(function (i) { return i.kind === 'file'; }).map(function (i) { return i.getAsFile(); }).filter(isMedia);
  if (!fs.length) return;
  e.preventDefault();
  fs.forEach(addDraftFile);
});
/* 拖进小窗的归笔记，不归外部资料入口（页面别处松手才是外部资料入口） */
note.addEventListener('dragover', function (e) {
  if (!hasFiles(e)) return;
  e.preventDefault(); e.stopPropagation();
  document.body.classList.remove('dragging');
  note.classList.add('drop');
});
note.addEventListener('dragleave', function (e) { if (!note.contains(e.relatedTarget)) note.classList.remove('drop'); });
note.addEventListener('drop', function (e) {
  if (!hasFiles(e)) return;
  e.preventDefault(); e.stopPropagation();
  note.classList.remove('drop');
  document.body.classList.remove('dragging');
  const fs = Array.from(e.dataTransfer.files || []), ok = fs.filter(isMedia);
  if (ok.length < fs.length) toast('随堂笔记只收图片和录屏；别的文件拖到页面别处，放进外部资料入口');
  ok.forEach(addDraftFile);
});

/* 「截图」「录屏」：后台替你按系统快捷键，截好、录好的自己进草稿。截图时小窗先藏起来；
   你按了 Esc（浏览器拿回焦点、一会儿还没图）就算不截了；再点一下按钮、点等待块上的 × 也是不等了 */
async function startCapture(kind) {
  if (!online) { toast('没连后端，截不了'); return; }
  if (CAP) { api('POST', 'api/note/capture/cancel').catch(function () {}); return; }
  try { await api('POST', 'api/note/capture', { kind: kind }); } catch (e) { toast(e.message); return; }
  const st = CAP = { kind: kind, blurred: false, noShow: false };
  if (kind === 'image') note.style.visibility = 'hidden';
  renderAtt(); markCapBtns();
  const stop = function () { api('POST', 'api/note/capture/cancel').catch(function () {}); };
  const onBlur = function () { st.blurred = true; };
  const onFocus = function () { if (kind === 'image' && st.blurred) setTimeout(function () { if (CAP === st) stop(); }, 1500); };
  addEventListener('blur', onBlur); addEventListener('focus', onFocus);
  const noShow = setTimeout(function () { if (CAP === st && !st.blurred) { st.noShow = true; stop(); } }, 6000);
  while (true) {
    await new Promise(function (r) { setTimeout(r, 700); });
    let s0;
    try { s0 = await api('GET', 'api/note/capture'); } catch (e) { continue; }
    if (!s0.kind) break;
  }
  clearTimeout(noShow); removeEventListener('blur', onBlur); removeEventListener('focus', onFocus);
  CAP = null;
  note.style.visibility = '';
  if (st.noShow) toast(kind === 'image' ? '系统截图没叫出来：按 Win+Shift+S 截好，在这里 Ctrl+V 贴' : '系统录屏没叫出来：按 Win+Shift+R 录好，把 mp4 拖进小窗');
  markCapBtns();
  await loadDrafts();
  if (note.classList.contains('open')) ta.focus();
}
function markCapBtns() {
  $('#nshot').classList.toggle('on', !!(CAP && CAP.kind === 'image'));
  $('#nrec').classList.toggle('on', !!(CAP && CAP.kind === 'video'));
}
document.getElementById('nshot').onclick = function () { startCapture('image'); };
document.getElementById('nrec').onclick = function () { startCapture('video'); };

/* 录屏抽 5 张画面：在 1/10、3/10 … 9/10 处各截一张，宽最多 1280，放在录屏旁边给 agent 看 */
async function extractFrames(it) {
  if (FRAMING.has(it.name) || !online) return;
  FRAMING.add(it.name); renderAtt();
  try {
    const v = document.createElement('video');
    v.muted = true; v.preload = 'auto'; v.src = purl(it.path);
    await new Promise(function (ok, bad) { v.onloadedmetadata = ok; v.onerror = function () { bad(new Error('这段录屏打不开')); }; });
    let d = v.duration;
    if (!isFinite(d)) {                                // 浏览器录的 webm 常常不写时长：先跳到最后，逼它算出来
      await new Promise(function (ok) { v.onseeked = ok; v.currentTime = 1e101; });
      d = v.duration;
    }
    if (!isFinite(d) || d <= 0 || !v.videoWidth) throw new Error('读不出录屏有多长');
    const W = Math.min(1280, v.videoWidth), H = Math.round(v.videoHeight * W / v.videoWidth);
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d'), fd = new FormData();
    for (let i = 0; i < 5; i++) {
      await new Promise(function (ok) { v.onseeked = ok; v.currentTime = d * (2 * i + 1) / 10; });
      g.drawImage(v, 0, 0, W, H);
      fd.append('files', await new Promise(function (r) { c.toBlob(r, 'image/jpeg', 0.85); }), (i + 1) + '.jpg');
    }
    const r = await fetch(it.saved ? 'api/note/saved/frames?path=' + encodeURIComponent(it.path)
      : 'api/note/drafts/' + encodeURIComponent(it.name) + '/frames', { method: 'POST', body: fd });
    const got = await r.json();
    if (!r.ok) throw new Error(got.detail || '画面没存上');
    if (!got.seconds) got.seconds = d;                // 浏览器录的 webm 文件里没写时长：用刚算出来的
    const k = NIMG.findIndex(function (x) { return x.name === it.name; });
    if (k >= 0) NIMG[k] = got;
  } catch (e) { toast('录屏的画面没抽成：' + e.message); }
  FRAMING.delete(it.name); renderAtt();
}

/* ---- 画板（照微信：截完就能画）：框 · 圈 · 箭头 · 画笔 · 文字 · 马赛克；颜色、粗细；撤销 · 取消 · 完成 ----
   画在原图大小上（放大缩小都不糊）；马赛克是刷子，刷哪糊哪；文字点哪打哪，回车落下。「完成」换掉草稿里那张 */
const DR = { it: null, frame: -1, img: null, mos: null, scratch: null, ops: [], cur: null, text: null,
             tool: 'rect', color: '#e5484d', thick: false, base: 2, block: 10 };
const DTOOLS = [['rect', '框'], ['ellipse', '圈'], ['arrow', '箭头'], ['pen', '画笔'], ['text', '文字'], ['mosaic', '马赛克']];
const DCOLS = [['红', '#e5484d'], ['黄', '#f5b400'], ['绿', '#30a46c'], ['蓝', '#0090ff'], ['白', '#ffffff'], ['黑', '#111111']];
function drawBar() {
  const it = DR.it;
  $('#dbar').innerHTML = DTOOLS.map(function (t) { return '<button data-tool="' + t[0] + '"' + (DR.tool === t[0] ? ' class="on"' : '') + '>' + t[1] + '</button>'; }).join('')
    + '<span class="sep"></span>'
    + DCOLS.map(function (c) { return '<button class="sw' + (DR.color === c[1] ? ' on' : '') + '" data-color="' + c[1] + '" title="' + c[0] + '" style="background:' + c[1] + '"></button>'; }).join('')
    + '<span class="sep"></span><button data-thick="0"' + (DR.thick ? '' : ' class="on"') + '>细</button><button data-thick="1"' + (DR.thick ? ' class="on"' : '') + '>粗</button>'
    + (it.kind === 'video' ? '<span class="sep"></span>' + it.frames.map(function (f, i) { return '<button data-frame="' + i + '"' + (i === DR.frame ? ' class="on"' : '') + '>画面 ' + (i + 1) + '</button>'; }).join('') + '<button data-play>看录屏</button>' : '')
    + '<span class="sep"></span><button data-undo>撤销</button><button data-cancel>取消</button><button class="pri" data-done>完成</button>';
}
async function openDraw(it, frame) {
  const path = it.kind === 'video' ? it.frames[frame] : it.path;
  const img = new Image();
  try { await new Promise(function (ok, bad) { img.onload = ok; img.onerror = bad; img.src = purl(path, Date.now()); }); }
  catch (e) { toast('这张图打不开'); return; }
  Object.assign(DR, { it: it, frame: frame, img: img, ops: [], cur: null, text: null });
  const c = $('#dcv'), W = img.naturalWidth, H = img.naturalHeight;
  c.width = W; c.height = H;
  DR.base = Math.max(2, Math.round(Math.max(W, H) / 400));
  DR.block = Math.max(8, Math.round(Math.max(W, H) / 90));
  const small = document.createElement('canvas');                       // 马赛克那一层：整张先糊好，刷到哪露到哪
  small.width = Math.ceil(W / DR.block); small.height = Math.ceil(H / DR.block);
  small.getContext('2d').drawImage(img, 0, 0, small.width, small.height);
  DR.mos = document.createElement('canvas'); DR.mos.width = W; DR.mos.height = H;
  const mg = DR.mos.getContext('2d');
  mg.imageSmoothingEnabled = false;
  mg.drawImage(small, 0, 0, W, H);
  DR.scratch = document.createElement('canvas'); DR.scratch.width = W; DR.scratch.height = H;
  $('#draw').hidden = false;
  drawBar(); redraw();
}
function dpath(g, pts) {
  g.beginPath(); g.moveTo(pts[0].x, pts[0].y);
  pts.forEach(function (q) { g.lineTo(q.x, q.y); });
  if (pts.length === 1) g.lineTo(pts[0].x + 0.01, pts[0].y);            // 只点一下也留个点
}
function drawOp(g, o) {
  g.save();
  g.strokeStyle = g.fillStyle = o.color; g.lineWidth = o.w; g.lineCap = g.lineJoin = 'round';
  const a = o.pts[0], b = o.pts[1] || a;
  if (o.t === 'rect') g.strokeRect(Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(b.x - a.x), Math.abs(b.y - a.y));
  else if (o.t === 'ellipse') { g.beginPath(); g.ellipse((a.x + b.x) / 2, (a.y + b.y) / 2, Math.abs(b.x - a.x) / 2, Math.abs(b.y - a.y) / 2, 0, 0, 2 * Math.PI); g.stroke(); }
  else if (o.t === 'arrow') {
    const ang = Math.atan2(b.y - a.y, b.x - a.x), h = o.w * 6;
    g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x - Math.cos(ang) * h * 0.6, b.y - Math.sin(ang) * h * 0.6); g.stroke();
    g.beginPath(); g.moveTo(b.x, b.y);
    g.lineTo(b.x - h * Math.cos(ang - 0.45), b.y - h * Math.sin(ang - 0.45));
    g.lineTo(b.x - h * Math.cos(ang + 0.45), b.y - h * Math.sin(ang + 0.45));
    g.closePath(); g.fill();
  }
  else if (o.t === 'pen') { dpath(g, o.pts); g.stroke(); }
  else if (o.t === 'mosaic') {
    const t = DR.scratch, tg = t.getContext('2d');
    tg.globalCompositeOperation = 'source-over'; tg.clearRect(0, 0, t.width, t.height);
    tg.lineWidth = o.w; tg.lineCap = tg.lineJoin = 'round'; tg.strokeStyle = '#000';
    dpath(tg, o.pts); tg.stroke();
    tg.globalCompositeOperation = 'source-in'; tg.drawImage(DR.mos, 0, 0);
    g.drawImage(t, 0, 0);
  }
  else if (o.t === 'text') {
    g.font = '700 ' + o.size + 'px ' + getComputedStyle(document.body).fontFamily;
    g.textBaseline = 'top';
    o.text.split('\n').forEach(function (line, i) { g.fillText(line, a.x, a.y + i * o.size * 1.25); });
  }
  g.restore();
}
function redraw() {
  const c = $('#dcv'), g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  g.drawImage(DR.img, 0, 0);
  DR.ops.concat(DR.cur ? [DR.cur] : []).forEach(function (o) { drawOp(g, o); });
}
function dpos(e) {
  const c = $('#dcv'), r = c.getBoundingClientRect();
  return { x: (e.clientX - r.left) * c.width / r.width, y: (e.clientY - r.top) * c.height / r.height };
}
$('#dcv').addEventListener('pointerdown', function (e) {
  if (e.button !== 0) return;
  const q = dpos(e);
  commitText();
  if (DR.tool === 'text') { e.preventDefault(); startText(q); return; }
  DR.cur = { t: DR.tool, color: DR.color, w: DR.tool === 'mosaic' ? DR.block * 3 : DR.base * (DR.thick ? 2.5 : 1), pts: [q] };
  this.setPointerCapture(e.pointerId);
});
$('#dcv').addEventListener('pointermove', function (e) {
  if (!DR.cur) return;
  const q = dpos(e);
  if (DR.cur.t === 'pen' || DR.cur.t === 'mosaic') DR.cur.pts.push(q); else DR.cur.pts[1] = q;
  redraw();
});
$('#dcv').addEventListener('pointerup', function () {
  if (!DR.cur) return;
  const o = DR.cur;
  DR.cur = null;
  if (o.pts.length > 1 || o.t === 'pen' || o.t === 'mosaic') DR.ops.push(o);   // 框、圈、箭头只点一下不拖：不算
  redraw();
});
function startText(q) {
  const t = $('#dtext'), c = $('#dcv'), r = c.getBoundingClientRect(), st = $('#dstage').getBoundingClientRect();
  const k = r.width / c.width, size = DR.base * (DR.thick ? 15 : 10);
  DR.text = { q: q, size: size, color: DR.color };
  t.hidden = false; t.value = '';
  t.style.left = (r.left - st.left + q.x * k) + 'px'; t.style.top = (r.top - st.top + q.y * k) + 'px';
  t.style.fontSize = size * k + 'px'; t.style.color = DR.color;
  t.style.width = Math.max(120, (r.right - r.left) - q.x * k - 8) + 'px'; t.style.height = size * k * 1.35 + 'px';
  setTimeout(function () { t.focus(); }, 0);
}
function commitText() {
  const t = $('#dtext');
  if (!DR.text) return;
  const v = t.value.replace(/\s+$/, '');
  if (v) DR.ops.push({ t: 'text', color: DR.text.color, size: DR.text.size, pts: [DR.text.q], text: v });
  DR.text = null; t.hidden = true; t.value = '';
  redraw();
}
$('#dtext').addEventListener('keydown', function (e) {
  e.stopPropagation();
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitText(); }
  else if (e.key === 'Escape') { DR.text = null; this.hidden = true; this.value = ''; }
});
$('#dtext').addEventListener('input', function () { this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px'; });
$('#dtext').addEventListener('blur', function () { setTimeout(commitText, 0); });
async function saveDraw() {
  commitText();
  if (!DR.ops.length) return true;
  const it = DR.it, target = it.kind === 'video' ? it.frames[DR.frame] : it.path, name = target.split('/').pop();
  const jpg = /\.jpe?g$/i.test(name);
  const blob = await new Promise(function (r) { $('#dcv').toBlob(r, jpg ? 'image/jpeg' : 'image/png', 0.92); });
  const fd = new FormData();
  fd.append('file', blob, jpg ? 'drawn.jpg' : 'drawn.png');
  if (it.saved) {                                  // 已经记进笔记本的：换掉那张（原图后台先留底）
    try {
      const r = await fetch('api/note/saved/image?path=' + encodeURIComponent(target), { method: 'PUT', body: fd });
      const got = await r.json();
      if (!r.ok) throw new Error(got.detail || '没存上');
      BUST[target] = Date.now(); DR.ops = [];
      if (view === 'notes') showNotes();
      return true;
    } catch (err) { toast(err.message); return false; }
  }
  try {
    const r = await fetch('api/note/drafts/' + encodeURIComponent(name), { method: 'PUT', body: fd });
    const got = await r.json();
    if (!r.ok) throw new Error(got.detail || '没存上');
    got.v = Date.now();
    const k = NIMG.findIndex(function (x) { return x.name === it.name; });
    if (k >= 0) NIMG[k] = got;
    DR.it = got; DR.ops = [];
    renderAtt();
    return true;
  } catch (err) { toast(err.message); return false; }
}
function closeDraw() {
  DR.text = null; $('#dtext').hidden = true;
  $('#draw').hidden = true;
  DR.it = null; DR.ops = [];
  if (note.classList.contains('open')) ta.focus();
}
$('#notesview').addEventListener('click', function (e) {
  const img = e.target.closest('img.nimg[data-path]');
  if (!img || !/^笔记\/(截图|录屏)\//.test(img.dataset.path)) return;
  e.preventDefault();
  openDraw({ kind: 'image', path: img.dataset.path, saved: true }, -1);
});
$('#dbar').addEventListener('click', async function (e) {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.tool) { commitText(); DR.tool = b.dataset.tool; drawBar(); }
  else if (b.dataset.color) { DR.color = b.dataset.color; drawBar(); }
  else if (b.dataset.thick) { DR.thick = b.dataset.thick === '1'; drawBar(); }
  else if (b.hasAttribute('data-undo')) { commitText(); DR.ops.pop(); redraw(); }
  else if (b.hasAttribute('data-cancel')) closeDraw();
  else if (b.hasAttribute('data-done')) { if (await saveDraw()) closeDraw(); }
  else if (b.hasAttribute('data-play')) window.open(purl(DR.it.path), '_blank');
  else if (b.dataset.frame) {
    const i = +b.dataset.frame;
    if (i !== DR.frame && await saveDraw()) openDraw(DR.it, i);        // 换一张画面前，画过的先存上
  }
});

/* 「＋ 快捷」：往上弹一个小菜单，点一条接在后面；最下面是「清空」 */
function noteMenu(on) {
  const m = $('#nmenu'), open = on === undefined ? m.hidden : on;
  m.hidden = !open;
  $('#nplus').classList.toggle('on', open);
}
document.getElementById('nplus').onclick = function () { noteMenu(); };
note.addEventListener('pointerdown', function (e) {
  if (!e.target.closest('#nmenu, #nplus')) noteMenu(false);
});
ta.addEventListener('keydown', function (e) {                 // Ctrl+Enter 记下
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); document.getElementById('nsave').click(); }
});
document.getElementById('nback').onclick = async function () {     // 清空、整段删掉之前的草稿，点一条接回小窗里
  const box = $('#nbk');
  if (box.innerHTML) { box.innerHTML = ''; return; }
  let r;
  try { r = await api('GET', 'api/note/backups'); } catch (e) { toast(e.message); return; }
  box.innerHTML = r.items.length ? r.items.map(function (b, i) {
    return '<button class="nbk" data-nbk="' + i + '" title="' + esc(b.text.slice(0, 300)) + '">' + esc(fmtTime(b.at)) + ' · ' + esc(b.text.replace(/\s+/g, ' ').slice(0, 24)) + '</button>';
  }).join('') : '<div class="hint">没有留底的</div>';
  box.querySelectorAll('[data-nbk]').forEach(function (x) {
    x.onclick = function () {
      const b = r.items[+x.dataset.nbk];
      noteMenu(false); box.innerHTML = '';
      appendNote(b.text);
      toast('接回来了（' + fmtTime(b.at) + ' 那份）');
    };
  });
};
document.getElementById('nclear').onclick = function () {
  noteMenu(false);
  ta.value = ''; count(); ta.focus();
  if (!CAN_ONLINE) { try { localStorage.removeItem(KEY); } catch (e) {} return; }
  noteDirty = true; saveNote();
};

/* 导出：拼成一段可直接粘给 agent 的指令。
   状态是页面现算的，「这次看了什么」是边用边记的，你只写「我的判断」。 */
function buildInstruction() {
  const page = pageLabel();
  const L = ['# 给 agent 的指令', '',
    '项目：' + (S ? S.project.name + '（' + S.project.root + '）' : '项目名称'),
    '当前页：' + page,
    '时间：' + new Date().toLocaleString('zh-CN'), '',
    '## 当前状态（页面现算）'];
  if (S) {
    L.push('- 模块 ' + S.modules.length + ' 个（资料/ 下的文件夹）：' + S.modules.map(function (x) { return x.name + ' ' + x.files; }).join(' · '));
    if (S.blueprint.length) {
      const c = S.counts;
      L.push('- 蓝图 ' + S.blueprint.length + ' 个大目标（资料/蓝图/），底下的小目标：齐了 ' + c.ok + ' · 不够 ' + c.warn + ' · 在做 ' + c.todo + ' · 还没开始 ' + c.bad);
    }
    L.push('- 等我拍板 ' + S.pending.length + ' 条' + (S.pending.length ? '：' + S.pending.map(function (q) { return q.code; }).join('、') : ''));
  } else {
    L.push('- （没连后端，读不到状态）');
  }
  L.push('', '## 这次我看了什么（页面自动记的，' + ACT.start.toLocaleTimeString('zh-CN') + ' 起）');
  L.push('- 看过：' + (ACT.seen.size ? Array.from(ACT.seen).join(' · ') : '没往下看'));
  L.push('- 点过：' + (ACT.clicked.length ? ACT.clicked.join(' · ') : '没点'));
  if (ACT.viewed.length) L.push('- 打开看过的文件：' + ACT.viewed.join('、'));
  if (ACT.added.length) L.push('- 加了模块：' + ACT.added.join('、'));
  if (ACT.delreq.length) L.push('- 要删的模块（怎么删见下面「我的判断」）：' + ACT.delreq.join('、'));
  if (ACT.decided.length) L.push('- 拍了板：' + ACT.decided.join('；'));
  if (ACT.dropped.length) L.push('- 放进外部资料入口：' + ACT.dropped.join('、'));
  if (ACT.sorted.length) L.push('- 分拣了：' + ACT.sorted.join('；'));
  if (ACT.searched.length) L.push('- 搜过：' + ACT.searched.slice(-5).join('、'));
  if (ACT.installed.length) L.push('- 装了：' + ACT.installed.join('、'));
  L.push('', '## 这次交给你的笔记（上次复制以后新记的，带编号，文件在 笔记/ 里）');
  if (FRESH.length) {
    let last = null;
    FRESH.forEach(function (e) {
      if (e.scope !== last) { L.push('### ' + e.scope + '（笔记/' + e.scope + '.md）'); last = e.scope; }
      L.push('- ' + e.id + ' · ' + e.at + ' · ' + who(e.by) + ' · ' + e.kind + '：' + e.body.replace(/\n/g, ' / '));
    });
  } else L.push('（没有新记的）');
  if (ta.value.trim() || NIMG.length) {
    L.push('', '## 我还没记下的');
    if (ta.value.trim()) L.push(ta.value.trim());
    NIMG.forEach(function (x) {
      if (x.kind === 'video') L.push('- 录屏：' + x.path + (x.frames.length ? '（看不了视频就看这几张画面：' + x.frames.join('、') + '）' : ''));
      else L.push('- 截图：' + x.path);
    });
  }
  L.push('',
    '## 约束',
    '- 产物放进对应模块的文件夹（资料/<模块名>/）；新模块用 MCP 的 add_module 建',
    '- 不要移动、重命名、重组我没让你动的文件',
    '- 删东西只照笔记里的「删除请求」做：用 MCP 的 move_to_trash 挪进 回收站/，不要直接删；彻底删掉要我另外说',
    '- 做完把结果登记回来');
  if (S) L.push('', '（可以用 MCP 工具 get_overview 看项目全貌、read_notes 读我的笔记——服务名 research-console）');
  return L.join('\n') + '\n';
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    const x = document.createElement('textarea');
    x.value = t; x.style.position = 'fixed'; x.style.opacity = '0';
    document.body.appendChild(x); x.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
    x.remove(); return ok;
  }
}
document.getElementById('ncopy').onclick = async function () {
  const b = this, old = b.textContent, txt = buildInstruction();
  const ok = await copyText(txt);
  let saved = false;
  if (online) {   // 复制过的整段存进 笔记/历史/，永不删；复制失败时 agent 也能自己读
    try { await api('POST', 'api/notes/copy', { text: txt }); saved = true; FRESH = []; } catch (e) {}
  }
  b.textContent = ok ? '已复制，粘给 agent' : saved ? '没复制上，但已存进库' : '没复制上，再点一次';
  if (!ok && saved) toast('复制没成功，不过这条指令已存进库：让 agent 调 read_notes 就能读到');
  setTimeout(function () { b.textContent = old; }, 1800);
};

/* ---- 快捷键：N 笔记 · [ 收放侧栏 · T 昼夜 ---- */
document.addEventListener('keydown', function (e) {
  if (!$('#draw').hidden) {
    if (e.target.id === 'dtext') return;
    if (e.key === 'Escape') { e.preventDefault(); closeDraw(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); commitText(); DR.ops.pop(); redraw(); }
    return;
  }
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') {
    if (e.key === 'Escape') { if (!$('#nmenu').hidden) noteMenu(false); else toggleNote(false); }
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); toggleNote(); }
  const bracket = e.key === '[' || e.key === '【' || e.code === 'BracketLeft';   // 中文输入法开着时 [ 打出来是 【
  if (bracket && zenOn()) { e.preventDefault(); zenToc(); return; }
  const fsw = bracket && (document.querySelector('.pvwrap.pvfs') || (document.fullscreenElement && document.fullscreenElement.closest('.pvwrap')));
  const zv = fsw && fsw.querySelector('.zipv');
  if (zv) { e.preventDefault(); zipToggle(zv); return; }                     // 全屏看压缩包：[ 收放它的目录
  if (bracket) document.getElementById(view === 'mod' ? 'tree' : view === 'search' ? 'ptree' : 'toc').classList.toggle('hide');
  if (e.key === 't' || e.key === 'T') flipTh();
  if (e.key === 'Escape') {
    if (!$('#nmenu').hidden) noteMenu(false);
    else if (note.classList.contains('open')) toggleNote(false);
    else if (document.querySelector('aside.zshow')) zenToc(false);
    else if (zenOn()) setZen(false);
    return;
  }
  if (!zenOn() || !zenSeq()) return;                       // 下面是禅读的上下左右
  if (e.key === 'ArrowDown') zenVertical(1, e);
  else if (e.key === 'ArrowUp') zenVertical(-1, e);
  else if (e.key === ' ') { if (e.shiftKey ? atTop() : atBottom()) zenVertical(e.shiftKey ? -1 : 1, e); else zenDisarm(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); zenSide(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); zenSide(-1); }
});

/* ---- 开始 ---- */
routeWithInitialRead();
load();
connectWS();
</script>
