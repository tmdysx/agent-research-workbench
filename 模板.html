<style>
/* ==============================================================
   三条 lane + 左栏台账 + 右栏正文 + 笔记导出
   只做电脑宽度，不做手机。

   两种打开方式：
   - 双击这个文件（file://）→ 只看样子，内容是占位，改动存不下来
   - 双击「启动.bat」（http://）→ 接后端，真数据，改动进库，
     agent 从 MCP 写进来的一秒内自己出现

   四条 CSS 铁律（都是实际撞出来的，别改）：
   1. white-space:nowrap 必须加在【链接】上 —— 不加，中文被逐字折成竖排
   2. flex-wrap:nowrap + overflow-x:auto 放在【每条 lane】上，不放 nav 上
   3. sticky 与 overflow 不能同层 —— nav 负责 sticky（无 overflow），
      lane 负责横滚。写反了要么钉不住、要么滚不了
   4. 别给 html/body 写 height:100% —— sticky 只能在容纳块内粘住，
      body 锁成一屏高，滚过一屏 nav 就脱手。用 min-height
   ============================================================== */
/* ---------- 外观：默认「黑白极简」，能换皮肤 ----------------------
   作者 10-01：「外观做成设置里能换的……先用精简黑白为通用模板适合大众，然后再找两个皮肤放默认里，其他的就可以让玩家自己DIY了」。
   这里写的是默认那套；设置 → 外观 选了别的，就在这份样式后面加一份 外观/<名字>.css 把变量盖掉（见 外观/说明.md）。
   别处只用下面这些变量，不写死颜色、字体。
   【状态色不跟着主题变】——好/不够/在做/没开始 四色是固定语义，
   换皮肤时不许动，而且永远配图标+文字，不靠颜色单独表意。
   ---------------------------------------------------------------- */
:root{
  color-scheme: light;
  --plane:#fafafa;                 /* 页面底 */
  --card:#ffffff;                  /* 卡片/顶栏 */
  --fg:#171717;
  --fg2:#404040;
  --muted:#6b6b6b;                 /* 对 --card 5.3:1：小字看得清 */
  --line:#ebebeb;
  --ring:rgba(0,0,0,.09);
  --accent:#171717;                /* 主按钮、选中、链接 */
  --onaccent:#ffffff;              /* 主按钮上的字 */
  --lane2:rgba(0,0,0,.028);        /* 业务载荷那条的底色 */
  --font:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Microsoft YaHei",monospace;
  --lh:1.65;
  /* 状态色：固定，不随主题 */
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --ch1:#3b82f6;                   /* 图里分组的头一个颜色（蓝），别的组用状态色；亮暗都看得清 */
  --ch5:#8b5cf6;                   /* 看板「等验收」那一列（紫）：跟在做、等着分得开 */
  --navh:150px;                    /* JS 量出来后覆盖，不写死 */
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  color-scheme: dark;
  --plane:#0a0a0a; --card:#161616; --fg:#ededed; --fg2:#c7c7c7;
  --muted:#a1a1a1; --line:#2a2a2a; --ring:rgba(255,255,255,.1);
  --accent:#ededed; --onaccent:#0a0a0a; --lane2:rgba(255,255,255,.04);
}}
:root[data-theme=dark]{
  color-scheme: dark;
  --plane:#0a0a0a; --card:#161616; --fg:#ededed; --fg2:#c7c7c7;
  --muted:#a1a1a1; --line:#2a2a2a; --ring:rgba(255,255,255,.1);
  --accent:#ededed; --onaccent:#0a0a0a; --lane2:rgba(255,255,255,.04);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}          /* 铁律 4 */

/* 字号 = 跟窗口走的基准 × 你手动调的倍数
   clamp 管「窗口宽字大、窄字小」；--fs 管「A- / A+」两个按钮。
   两个相乘，所以拖窗口和手动调互不干扰。其余字号一律用 rem。 */
html{font-size:calc(clamp(13.5px, .32vw + 12.3px, 17px) * var(--fs, 1))}

body{background:var(--plane);color:var(--fg);
  font:1rem/var(--lh) var(--font)}

/* ---------- 顶栏：三条 lane（铁律 3：sticky 在这层，无 overflow） ---------- */
nav.top{position:sticky;top:0;z-index:30;background:var(--card);
  border-bottom:1px solid var(--line)}

/* laneBox 是不滚的外壳，放箭头和渐隐；lane 是里面真正横滚的那层 */
.laneBox{position:relative;border-bottom:1px solid var(--line)}
.laneBox:last-child{border-bottom:none}
.lane{display:flex;align-items:center;gap:2px;
  flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;   /* 铁律 2 */
  padding:0 18px;scrollbar-width:thin;scroll-behavior:smooth}
.lane::-webkit-scrollbar{height:6px}
.lane::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

/* 左右箭头：只在真的能滚时才出现 */
.arr{position:absolute;top:0;bottom:0;width:26px;z-index:3;display:none;
  align-items:center;justify-content:center;cursor:pointer;
  border:none;background:var(--card);color:var(--fg2);font-size:.9375rem;line-height:1;
  padding:0;opacity:.9}
.arr:hover{color:var(--accent)}
.arr.l{left:0;box-shadow:10px 0 12px -6px var(--card)}
.arr.r{right:0;box-shadow:-10px 0 12px -6px var(--card)}
.arr.show{display:flex}
.lane .brand{flex:0 0 auto;white-space:nowrap;font-weight:700;font-size:.875rem;
  padding-right:12px;margin-right:4px;border-right:1px solid var(--line);
  position:sticky;left:0;background:inherit;z-index:2}
.lane .lab{flex:0 0 auto;font-size:.6875rem;color:var(--muted);letter-spacing:.06em;
  padding-right:10px;white-space:nowrap;position:sticky;left:0;background:inherit;z-index:1}
.lane a{flex:0 0 auto;white-space:nowrap;                /* 铁律 1 */
  padding:8px 11px;font-size:.8125rem;color:var(--fg);text-decoration:none;opacity:.72;
  border-bottom:2px solid transparent}
.lane a:hover{opacity:1}
.lane a.on{opacity:1;border-bottom-color:var(--accent);font-weight:600}
.lane.biz{background:var(--lane2)}
.lane.biz a.module-governance{background:color-mix(in srgb,var(--accent) 13%,transparent);border-radius:5px 5px 0 0}
.lane.biz a.module-business{background:color-mix(in srgb,#b89455 14%,transparent);border-radius:5px 5px 0 0}                        /* 唯一可增删的一条 */
.lane a .by{font-size:.625rem;color:var(--muted);margin-left:4px}
.lane a .n{font-size:.6875rem;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.chg{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-left:5px;vertical-align:2px}
.setmods.dim td{color:var(--muted)}
.scanpick{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:6px}
.scanbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--lane2);font-size:.8125rem}
.scanbar input{font:inherit;font-size:.8125rem;padding:3px 8px;border:1px solid var(--ring);border-radius:7px;background:var(--card);color:var(--fg);width:12rem}
#scanTree{max-height:26rem;overflow:auto;padding:4px 0}
.srow{display:flex;gap:8px;align-items:center;padding:2px 10px;font-size:.8125rem;white-space:nowrap}
.srow:hover{background:var(--lane2)}.srow.on{background:var(--lane2);box-shadow:inset 2px 0 0 var(--accent)}
.srow label{display:flex;gap:6px;align-items:center;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis}
.srow input[disabled]+span{color:var(--muted)}
.stog{width:1.2rem;flex:none;border:0;background:none;color:var(--muted);cursor:pointer;font-size:.75rem;padding:0;text-align:center}
.smode{flex:none;font-size:.6875rem;padding:0 6px;border-radius:5px;border:1px solid var(--ring);color:var(--fg2)}
.smode[data-m="一直盯着"]{border-color:var(--good);color:var(--good)}.smode[data-m="不看"]{border-style:dashed;color:var(--muted)}
.swhy{font-size:.6875rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
/* 中间那条里的分组小标：后端 / 前端 / 机制 / 新加的。不钉住，跟着滚 */
.lane .grp{flex:0 0 auto;white-space:nowrap;font-size:.625rem;color:var(--muted);letter-spacing:.08em;
  margin-left:8px;padding:2px 4px 2px 10px;border-left:1px solid var(--line)}
.lane a.gone{text-decoration:line-through;opacity:.45}

/* 第二栏上没有 ×：加减模块都在「设置 → 模块」（作者 2026-09-25：「模块在设置里加减模块，任务栏上就不要有那些叉叉了」）。
   删也不是网页删：只往笔记里写一句删除请求，交给 agent（作者：「删除也不要通过网页删……全权交给 AI 处理」） */
.lane .spacer{flex:1 0 2.5rem}                 /* 把后面那组推到最右；窗口窄得要横滚时也至少空出一截 */
#newproj{flex:0 0 auto;font:inherit;font-size:.75rem;white-space:nowrap;cursor:pointer;margin-left:8px;padding:4px 9px;border-radius:7px;border:1px solid var(--ring);background:var(--plane);color:var(--fg);line-height:1.5}
#newproj:hover{border-color:var(--accent);color:var(--accent)}
#newproj.utility-icon{width:2.1rem;height:2rem;display:inline-flex;align-items:center;justify-content:center;padding:.3rem}
.lane .tail{flex:0 0 auto;white-space:nowrap;margin-left:auto;padding-left:14px;
  font-size:.6875rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.dot.off{background:var(--muted)}
.dot.bad{background:var(--crit)}

/* ---------- 工具条：A- A+ · 风格 · 禅读 · 笔记 ------------
   必须【钉在右边不动】。放进横滚的 lane 里会被推到几百像素外，
   等于没有 —— 这是实际踩过的。所以它在 laneBox 上，不在 lane 里。
   lane 右侧留出 --toolsw 的空位，内容不会钻到它下面。
   ------------------------------------------------------------- */
.tools{position:absolute;right:0;top:0;bottom:0;z-index:4;
  display:flex;align-items:center;gap:5px;
  padding:0 14px 0 12px;background:var(--card);border-left:1px solid var(--line)}
.laneBox.hasTools > .lane{padding-right:calc(var(--toolsw, 16rem) + 10px)}
.laneBox.hasTools > .arr.r{right:var(--toolsw, 16rem)}
.tools .grp{display:flex;gap:3px}
.tools button{font:inherit;font-size:.75rem;white-space:nowrap;cursor:pointer;
  padding:4px 9px;border-radius:7px;border:1px solid var(--ring);
  background:var(--plane);color:var(--fg);line-height:1.5}
.tools button:hover{border-color:var(--accent);color:var(--accent)}
.tools button.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.tools .fs{font-variant-numeric:tabular-nums;min-width:2.1rem;text-align:center}

/* 禅读：只藏导航目录，保留图里的详情、终端和便签；正文使用释放的空间。 */
body.zen .shell > :is(#tree,#toc,#ptree){display:none}
body.zen .laneBox:nth-child(2), body.zen .laneBox:nth-child(3){display:none}  /* 藏中间和第三条，留第一条能出去 */
body.zen .shell > main.page,body.zen .shell > main#modview{max-width:none;width:100%;margin:0;line-height:1.85;
  padding-left:clamp(20px,3vw,64px);padding-right:clamp(20px,3vw,64px)}
/* 文字保留可读行宽，表格、图、双栏阅读和预览不跟着收窄。 */
body.zen main .md > :is(p,ul,ol,blockquote){max-width:108ch}
/* 禅读 · 上下左右：位置提示、到底浮出的「下一篇」、两边的淡箭头、换篇时的淡入加轻轻一滑 */
#zenPos{display:none;position:fixed;top:calc(var(--navh) + 6px);left:50%;transform:translateX(-50%);z-index:20;
  font-size:.6875rem;color:var(--muted);white-space:nowrap;pointer-events:none;background:var(--plane);padding:1px 10px;border-radius:9px}
#zenPos .dots{margin-left:8px;letter-spacing:2px}
#zenPos .dots b{color:var(--accent);font-weight:400}
body.zen #zenPos.show{display:block}
#zenHint{position:fixed;left:50%;bottom:22px;transform:translate(-50%, 12px);z-index:40;opacity:0;pointer-events:none;
  font-size:.8125rem;padding:7px 16px;border-radius:18px;background:var(--card);border:1px solid var(--ring);
  box-shadow:0 4px 16px rgba(0,0,0,.12);transition:opacity .15s, transform .15s;white-space:nowrap}
#zenHint.show{opacity:1;transform:translate(-50%, 0)}
#zenHint.up{bottom:auto;top:calc(var(--navh) + 30px)}
#zenHint .k{color:var(--muted);margin-left:8px;font-size:.75rem}
.zenEdge{display:none;position:fixed;top:30%;bottom:30%;width:56px;z-index:15;border:none;background:transparent;
  color:var(--fg2);font-size:1.75rem;cursor:pointer;opacity:0;transition:opacity .15s}
.zenEdge:hover{opacity:.55}
.zenEdge.l{left:0} .zenEdge.r{right:0}
body.zen .zenEdge.show{display:block}
@keyframes zin-d{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes zin-u{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
@keyframes zin-l{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes zin-r{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes zin-f{from{opacity:0}to{opacity:1}}
.zin-d{animation:zin-d .2s ease-out} .zin-u{animation:zin-u .2s ease-out}
.zin-l{animation:zin-l .2s ease-out} .zin-r{animation:zin-r .2s ease-out}
@media (prefers-reduced-motion: reduce){ .zin-d,.zin-u,.zin-l,.zin-r{animation:zin-f .2s ease-out} }
/* 禅读里的目录（作者 2026-09-27：「禅读也要能打开目录」）：左上角一个「目录」，或按 [ ；
   目录从左边滑出来盖在正文上，正文不挪；点一篇、点外面、按 Esc 就收回去 */
#zenToc{display:none;position:fixed;left:12px;top:calc(var(--navh) + 8px);z-index:31;font:inherit;font-size:.75rem;
  padding:4px 10px;border-radius:8px;border:1px solid var(--ring);background:var(--card);color:var(--fg2);cursor:pointer;opacity:.75}
#zenToc:hover, #zenToc.on{opacity:1;border-color:var(--accent);color:var(--accent)}
body.zen #zenToc{display:block}
body.zen #tree.zshow, body.zen #toc.zshow, body.zen #ptree.zshow, body.zen #side.zshow{display:block;position:fixed;left:0;
  top:var(--navh);bottom:0;width:330px;max-width:86vw;max-height:none;margin-left:0;padding-top:46px;z-index:30;
  background:var(--plane);box-shadow:6px 0 24px rgba(0,0,0,.14);animation:zdrawer .18s ease-out}
@keyframes zdrawer{from{transform:translateX(-100%)}to{transform:none}}
@media (prefers-reduced-motion: reduce){ body.zen aside.zshow{animation:none} }

/* ---------- 主体：左栏台账 + 右栏正文 ---------- */
.shell{display:flex;align-items:flex-start}
aside{flex:0 0 var(--asidew, 250px);position:sticky;top:var(--navh);     /* 跟着字号走，不写死；宽度能拖（记在这台电脑） */
  max-height:calc(100vh - var(--navh));overflow-y:auto;
  padding:18px 14px 40px;border-right:1px solid var(--line);transition:margin-left .18s}
.shell > aside.hide{flex-basis:0;width:0;min-width:0;padding-left:0;padding-right:0;border-right:0;overflow:hidden}
.shell > aside.hide:not(.zshow){visibility:hidden}
/* 目录栏右边那条：拖它调宽窄，点小箭头收起 / 展开 */
#asgrip{position:fixed;width:9px;margin-left:-5px;cursor:col-resize;z-index:30;display:none}
#asgrip::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:1px;background:transparent;transition:background .15s}
#asgrip:hover::before, #asgrip.drag::before{background:var(--accent);width:2px}
#asgrip button{position:absolute;top:10px;left:-6px;width:20px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;
  background:var(--card);color:var(--muted);font-size:12px;line-height:1;cursor:pointer;opacity:0;transition:opacity .15s}
#asgrip:hover button, #asgrip.shut button{opacity:1}
body.asdrag{cursor:col-resize;user-select:none}
/* 预览全屏：浏览器肯给就真全屏，不肯给就铺满窗口；Esc 退出 */
.pvwrap:fullscreen, .pvwrap.pvfs{background:var(--plane);overflow:auto;padding:14px 22px}
.pvwrap.pvfs{position:fixed;inset:0;z-index:55}
.pvwrap .pvclose{display:none}
.pvwrap:fullscreen .pvclose, .pvwrap.pvfs .pvclose{display:flex;gap:6px;justify-content:flex-end;position:sticky;top:0;margin:0 0 8px;z-index:5}
body:has(.pvwrap.pvfs) #note, body:has(.rd.rdfs) #note{z-index:60}          /* 铺满窗口时，随堂笔记浮在上面 */
.pvwrap:fullscreen .pvv, .pvwrap.pvfs .pvv{max-width:none;max-height:calc(100vh - 70px)}
.pvwrap:fullscreen .xlwrap, .pvwrap.pvfs .xlwrap{max-height:calc(100vh - 110px)}
.pvwrap:fullscreen .pvf, .pvwrap.pvfs .pvf{height:calc(100vh - 70px)}
.pvwrap:fullscreen .pvi, .pvwrap.pvfs .pvi{max-height:calc(100vh - 70px);margin:0 auto}
.pvwrap:fullscreen .pvslide, .pvwrap.pvfs .pvslide{max-width:1100px;margin-left:auto;margin-right:auto}
aside .h{font-size:.9375rem;font-weight:650;color:var(--fg2);letter-spacing:.03em;margin:16px 0 6px}
aside .h:first-child{margin-top:0}
body[data-view=settings] #toc .h{font-size:1.125rem}
/* 目录像文件夹一样能收能展（S1-10 S2-12）：分组标题前一个小箭头，收起来下面那些藏起来 */
aside .fold-h{cursor:pointer;user-select:none}
aside .fold-car{display:inline-block;width:1em;color:var(--muted);font-size:.75em;text-align:center;cursor:pointer;flex:0 0 auto}
aside .fold-car:hover{color:var(--accent)}
aside .folded{display:none!important}
aside .row{display:flex;gap:8px;align-items:baseline;padding:5px 8px;
  border-radius:6px;font-size:.8125rem;cursor:pointer;border-left:2px solid transparent}
aside .row:hover{background:var(--plane)}
aside .row.on{background:var(--plane);border-left-color:var(--accent);font-weight:600}
aside .row .id{flex:0 0 42px;color:var(--muted);font-size:.75rem;font-variant-numeric:tabular-nums}
aside .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
aside .none{font-size:.75rem;color:var(--muted);padding:3px 10px}
aside .keys{font-size:.6875rem;color:var(--muted);line-height:1.9;margin-top:6px}
aside .keys kbd{border:1px solid var(--ring);border-radius:4px;padding:0 5px;
  font-family:var(--mono);font-size:.625rem}

main{flex:1;min-width:0;padding:24px 28px 90px;max-width:1000px}
body:not(.zen) .shell.directory-hidden > main, body:not(.zen) main#autoview{max-width:none}
body:not(.zen) .shell > :is(#tree,#toc,#ptree).hide{flex:0 0 0;width:0;min-width:0;padding-left:0;padding-right:0;border-right:0;overflow:hidden;visibility:hidden}
body:not(.zen) main#modview.governance-overview,
body:not(.zen) .shell.directory-hidden > main#modview,
body:not(.zen) .shell.directory-hidden > main#searchview,
body:not(.zen) main#saveview{max-width:none}
h1{font-size:1.375rem;margin:0 0 4px}
.sub{color:var(--fg2);font-size:.875rem;margin-bottom:18px}
.en{color:var(--muted);font-weight:400}                   /* 中英对照里的英文 */
.fk{color:var(--muted)}                                     /* 记录里的字段名（问题：、原来在：……）——不是英文，别用 .en，不然「中文」档会被藏掉 */
html[data-lang="zh"] .en{display:none}                      /* 设置 → 语言「中文」：英文都藏起来 */
html[data-lang="en"] .en{color:inherit;font-weight:inherit;font-size:inherit!important}   /* 「English」：成对标签只留英文，当正文显示 */

.gauge{display:flex;gap:10px;margin:16px 0 22px}
.g{flex:1;border:1px solid var(--ring);border-radius:10px;padding:11px 13px;background:var(--card)}
.g .n{font-size:1.5rem;font-weight:650;font-variant-numeric:tabular-nums}
.g .l{font-size:.75rem;color:var(--fg2)}

.card{background:var(--card);border:1px solid var(--ring);border-radius:11px;
  padding:16px 18px;margin:14px 0;border-top:3px solid var(--accent);  /* 彩色顶条分类 */
  scroll-margin-top:calc(var(--navh) + 12px)}
.card.c-lit{border-top-color:var(--good)}
.card.c-judge{border-top-color:var(--warn)}
.card.c-mods{border-top-color:var(--fg2)}
.card h2{margin:0 0 3px;font-size:1.125rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h2 .why{font-weight:400;font-size:.8125rem;color:var(--muted)}
.tag{font-size:.6875rem;font-weight:400;padding:1px 7px;border-radius:5px;
  border:1px dashed var(--ring);color:var(--muted);white-space:nowrap}
.hint{margin:8px 0 0;font-size:.8125rem;color:var(--muted)}
.warnbar{margin:0 0 14px;padding:9px 13px;border-radius:9px;font-size:.8125rem;
  border:1px solid var(--warn);background:rgba(250,178,25,.10);color:var(--fg)}

table{width:100%;border-collapse:collapse;font-size:.875rem;margin-top:10px}
th,td{text-align:left;padding:8px 9px;border-top:1px solid var(--line);
  vertical-align:top;overflow-wrap:anywhere}
th{font-size:.75rem;color:var(--muted);border-top:none;font-weight:600}
td.st{width:6.5rem;white-space:nowrap}
tr.on > td{background:var(--plane)}
tr.on > td:first-child{box-shadow:inset 2px 0 0 var(--accent)}

.chain{display:flex;flex-direction:column}
.step{display:flex;gap:11px}
.rail{flex:0 0 16px;display:flex;flex-direction:column;align-items:center}
.pt{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:0 0 auto}
.stem{flex:1;width:2px;background:var(--line)}
.step:last-child .stem{display:none}
.txt{flex:1;min-width:0;padding-bottom:12px}
.txt .t{font-size:.875rem;font-weight:600}
.txt .d{font-size:.8125rem;color:var(--fg2)}

/* ③ 待你判断：agent 提的问题，人攒着一起拍板 */
.ask{border-top:1px solid var(--line);padding:12px 0 10px;scroll-margin-top:calc(var(--navh) + 12px)}
.ask:first-child{border-top:none}
.ask .q{font-weight:600;font-size:.875rem}
.ask .meta{font-size:.75rem;color:var(--muted)}
.ask .ctx{font-size:.8125rem;color:var(--fg2);margin:5px 0 0;white-space:pre-wrap}
.ask .row2{display:flex;gap:8px;margin-top:8px;align-items:flex-start}
.ask textarea{flex:1;min-height:2.3rem;font:inherit;font-size:.8125rem;padding:6px 9px;resize:vertical;
  border:1px solid var(--ring);border-radius:8px;background:var(--plane);color:var(--fg);outline:none}
.ask textarea:focus{border-color:var(--accent)}
.btn{font:inherit;font-size:.8125rem;padding:6px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;
  border:1px solid var(--accent);background:var(--accent);color:var(--onaccent);font-weight:600}
.btn .en{color:inherit;opacity:.88}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:focus-visible,.sbtn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn:disabled,.sbtn:disabled{cursor:default;opacity:.5}
/* 本轮授权的自绘小图标：只辅助操作文字；状态仍用色点和文字 */
.ui-sprite{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.ui-icon{display:inline-block;width:1rem;height:1rem;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em;pointer-events:none}
.with-icon{display:inline-flex;align-items:center;justify-content:center;gap:.4rem}
nav .lane a>.ui-icon{width:var(--nav-icon-size,1.15rem);height:var(--nav-icon-size,1.15rem);stroke-width:var(--nav-icon-stroke,1.35);margin-right:.3rem}
.auto-gate{display:inline-flex;align-items:center;flex-wrap:wrap;gap:12px}
.gate-state{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;color:var(--fg2)}
.gate-state .gate-dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.gate-state.allowed .gate-dot{background:var(--good)}
.empty{font-size:.8125rem;color:var(--muted);padding:6px 0 2px}

/* ④ 全部模块：点一行展开验收和功能点 */
.code{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.75rem;white-space:nowrap}
#modsBody tr.m{cursor:pointer;scroll-margin-top:calc(var(--navh) + 40px)}
#modsBody tr.m:hover > td{background:var(--plane)}
#modsBody tr.m .d{font-size:.8125rem;color:var(--fg2)}
#modsBody tr.m.gone{opacity:.5}
#modsBody tr.m.gone b{text-decoration:line-through}
#modsBody tr.grp td{font-size:.6875rem;color:var(--muted);letter-spacing:.06em;padding-top:16px;border-top:none}
#modsBody tr.md td{border-top:none;padding-top:0;font-size:.8125rem;color:var(--fg2)}
#modsBody tr.md .box{background:var(--plane);border-radius:8px;padding:9px 12px;line-height:1.8}
#modsBody .pts{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:2px}
.moat{color:var(--accent);margin-left:6px}
td.who{white-space:nowrap;font-size:.75rem;color:var(--muted)}

.foot{margin-top:26px;font-size:.75rem;color:var(--muted);line-height:1.85}
#litBody tr{cursor:pointer}
#litBody tr:hover > td{background:var(--plane)}

/* ---------- 模块页：左边目录（名字/大小/时间），右边预览 ---------- */
/* 页面：总览 / 模块页 / 外部资料入口 / 检索 / 说明书，靠 body 上的 data-view 切换 */
#tree, #modview, #inboxview, #searchview, #guideview, #skillsview, #cmdview, #notesview, #planview, #toolsview, #autoview, #setview, #qaview, #trashview, #saveview, #ptree{display:none}
body[data-view=mod] #tree, body[data-view=mod] #modview,
body[data-view=inbox] #inboxview, body[data-view=search] #searchview, body[data-view=guide] #guideview,
body[data-view=skills] #skillsview, body[data-view=tools] #toolsview, body[data-view=auto] #autoview, body[data-view=settings] #setview, body[data-view=qa] #qaview, body[data-view=trash] #trashview, body[data-view=saves] #saveview, body[data-view=commands] #cmdview,
body[data-view=notes] #notesview, body[data-view=plans] #planview, body[data-view=search] #ptree{display:block}
body.zen #tree{display:none}
/* 外部资料入口 / 检索 / 说明书 / 技能 / 快捷指令：左边一栏本页目录，点一下跳过去 */
#toc{display:none}
body[data-view=inbox] #toc, body[data-view=notes] #toc, body[data-view=guide] #toc,
body[data-view=skills] #toc, body[data-view=tools] #toc, body[data-view=auto] #toc, body[data-view=settings] #toc, body[data-view=qa] #toc, body[data-view=trash] #toc, body[data-view=saves] #toc, body[data-view=commands] #toc, body[data-view=plans] #toc{display:block}
body.zen #toc, body.zen #ptree{display:none}
aside#ptree{flex-basis:var(--asidew, 300px);padding:14px 10px 40px}
aside#ptree.hide{margin-left:0}
#searchview .ph{margin-top:14px}
#searchview.wide{max-width:none}
/* 笔记本页：一条一条，编号在前 */
.nentry{border-top:1px solid var(--line);padding:12px 0;scroll-margin-top:calc(var(--navh) + 16px)}
.nentry .nmeta{font-size:.75rem;color:var(--muted)}
.nentry .nmeta b{color:var(--fg);font-variant-numeric:tabular-nums}
.nentry .nact{margin-left:10px}
.nentry .nact a{color:var(--muted);margin-left:6px}
.nentry .nact a:hover{color:var(--accent)}
.nentry .nbody{margin-top:2px}
.nentry .nbody p:first-child{margin-top:0}
.nedit textarea{width:100%;min-height:6rem;font:inherit;font-size:.875rem;padding:8px 10px;margin:6px 0;border:1px solid var(--accent);border-radius:8px;background:var(--card);color:var(--fg)}
aside#toc.hide{margin-left:0}
aside .row .meta{flex:0 0 auto;font-size:.6875rem;color:var(--muted);font-weight:400}
.icard, .kcard, .sgrp, .md h1, .md h2{scroll-margin-top:calc(var(--navh) + 16px)}
main.page{max-width:60rem}
.sbtn.on{border-color:var(--accent);color:var(--accent);font-weight:600}

/* 外部资料入口 Intake：大拖放区 + 每个文件一张分拣卡 */
.drop{display:block;margin:12px 0 18px;padding:34px 20px;text-align:center;cursor:pointer;color:var(--muted);
  border:2px dashed var(--ring);border-radius:12px;background:var(--card);transition:border-color .15s,background .15s}
.drop b{display:block;font-size:1rem;color:var(--fg);margin-bottom:4px}
.drop.over, body.dragging #inboxTab{border-color:var(--accent);background:var(--lane2);color:var(--accent)}
.icard{border-top:1px solid var(--line);padding:14px 0}
.icard .nm{font-weight:600;overflow-wrap:anywhere}
.icard .meta{font-size:.75rem;color:var(--muted)}
.cand{display:flex;align-items:baseline;gap:10px;margin-top:6px;padding:6px 10px;border-radius:8px;
  background:var(--card);border:1px solid var(--ring)}
.cand .mod{font-weight:600;min-width:4.5rem}
.cand .conf{font-size:.75rem;padding:0 6px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.conf-高{color:var(--good)} .conf-中{color:#b7791f} .conf-低{color:var(--muted)}
.cand .why{flex:1;font-size:.8125rem;color:var(--fg2)}
.cand .who{font-size:.6875rem;color:var(--muted);white-space:nowrap}
.icard .own{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:.8125rem;color:var(--fg2)}
.icard select{font:inherit;font-size:.8125rem;padding:3px 6px;border:1px solid var(--ring);border-radius:7px;background:var(--card);color:var(--fg)}
.lane a .n:empty{display:none}

/* 全站检索 */
.sinput{width:100%;margin-top:10px;font:inherit;font-size:1rem;padding:10px 14px;outline:none;
  border:1px solid var(--ring);border-radius:10px;background:var(--card);color:var(--fg)}
.sinput:focus{border-color:var(--accent)}
.sgrp{margin-top:18px}
.sgrp h3{font-size:.875rem;margin:0 0 4px}
.shit{padding:6px 8px;border-radius:7px}
.shit[data-m]{cursor:pointer}
.shit[data-m]:hover{background:var(--card)}
.shit .p{font-size:.8125rem;font-weight:600;overflow-wrap:anywhere}
.shit .l{font-size:.75rem;color:var(--fg2);font-family:var(--mono);overflow-wrap:anywhere}
.shit mark{background:rgba(250,178,25,.35);color:inherit;border-radius:2px}
.gbar{display:flex;gap:6px;justify-content:flex-end;margin-bottom:4px}

/* 技能 / 快捷指令 */
.kcard{border-top:1px solid var(--line);padding:14px 0}
.kcard .nm{font-weight:600}
.kcard .d{font-size:.8125rem;color:var(--fg2);margin:2px 0 8px}
.kcard .acts, .cform .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:.6875rem;font-weight:400;padding:0 6px;border-radius:4px;border:1px solid var(--ring);color:var(--muted);white-space:nowrap}
.badge.ok{border-color:var(--good);color:var(--good)}
.badge.diff{border-color:#b7791f;color:#b7791f}
/* 呼吸灯：接通 = 绿灯慢慢一明一暗；未接通 = 红灯常亮；还在查 = 灰 */
.lamp{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:var(--ring);vertical-align:middle;margin:0 .35rem 0 .1rem;flex:0 0 auto}
.lamp.on{background:var(--good);animation:breathe 2.4s ease-in-out infinite}
.lamp.off{background:var(--crit)}
@keyframes breathe{0%,100%{opacity:1;box-shadow:0 0 0 0 var(--good)}50%{opacity:.35;box-shadow:0 0 .45rem .1rem var(--good)}}
.lamp.wait{background:var(--warn)}          /* 停了等你 */
.lamp.done{background:var(--good)}          /* 跑完待验收：绿，不呼吸 */
@media (prefers-reduced-motion:reduce){.lamp.on{animation:none}}
/* 自动化：一张张开工单（作者 2026-09-27：「左边目录应该是每个自定义清单的一个文件……准备好了之后，按照要求把这些交给agent」） */
.wsteps{display:flex;align-items:center;gap:6px;margin:0 0 12px;font-size:.8125rem;color:var(--muted);flex-wrap:wrap}
.wsteps span{padding:3px 12px;border-radius:8px}
.wsteps span.on{background:color-mix(in srgb, var(--accent) 14%, transparent);color:var(--accent);font-weight:600}
.wsteps span.past{color:var(--good)}
.wsteps i{font-style:normal}
.wsteps .mpill{margin-left:auto;padding:3px 10px}
.wpaper{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 22px 16px}
.whead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.whead .wcode{color:var(--muted);font-size:1.25rem}
.whead .wname{font:inherit;font-size:1.25rem;font-weight:600;border:1px solid transparent;border-radius:8px;padding:1px 6px;margin-left:-4px;
  background:transparent;color:var(--fg);flex:1 1 12em;min-width:8em}
.whead .wfile{font-size:.75rem;color:var(--muted)}
.whead .wfile a, .wedit, .wprog a{cursor:pointer}
.wname:hover, .wname:focus, .wprod:hover, .wprod:focus{border-color:var(--ring);outline:none}
.wsec{display:flex;align-items:center;gap:8px;margin:16px 0 4px;font-size:.8125rem;color:var(--muted)}
.wsec .acts{margin-left:auto;display:flex;gap:6px}
.wprod{width:100%;font:inherit;border:1px solid transparent;border-radius:8px;padding:3px 6px;margin-left:-7px;background:transparent;color:var(--fg);resize:none;field-sizing:content}
.wrow{display:grid;grid-template-columns:12px 2.6em minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:7px 4px;border-top:1px solid var(--line);cursor:pointer}
.wrow:hover{background:var(--plane)}
.wrow .wk{color:var(--muted);font-size:.875rem}
.wrow .wv{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:baseline;min-width:0}
.wrow .wm{font-size:.75rem;color:var(--muted);text-align:right;max-width:24em}
.wrow .wm.bad{color:var(--serious)}
.wrow .wm.warn{color:var(--warn)}
.wchip{display:inline-flex;align-items:baseline;font-size:.875rem;padding:1px 2px 1px 8px;border-radius:6px;background:var(--plane);max-width:100%}
.wchip a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wchip .wx{border:0;background:none;color:var(--muted);cursor:pointer;font:inherit;padding:0 5px;opacity:0}
.wchip:hover .wx, .wchip .wx:focus{opacity:1}
.wchip .wx:hover{color:var(--serious)}
.wedit{font-size:.8125rem}
.wrow + .devdet, .wtgt{margin:2px 0 10px 20px}
.wtgt{border:1px solid var(--ring);border-radius:10px;padding:4px 12px 10px}
.wpick{border:1px solid var(--ring);border-radius:10px;padding:8px 10px;margin:4px 0 8px;background:var(--plane)}
.wtabs{display:flex;gap:4px;margin-bottom:8px}
.wtabs button{font:inherit;font-size:.8125rem;border:0;background:none;padding:3px 10px;border-radius:6px;cursor:pointer;color:var(--fg)}
.wtabs button.on{background:var(--card);box-shadow:0 0 0 1px var(--ring)}
.wpq{width:100%;font:inherit;font-size:.8125rem;padding:4px 8px;border:1px solid var(--ring);border-radius:8px;background:var(--card);color:var(--fg);margin-bottom:6px}
.wopts{display:flex;flex-wrap:wrap;gap:4px;max-height:14rem;overflow:auto}
.wopt{font:inherit;font-size:.8125rem;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:2px 8px;cursor:pointer;text-align:left}
.wopt[hidden]{display:none}
.wopt:hover{border-color:var(--accent);color:var(--accent)}
.wnotes{display:grid;grid-template-columns:3.5em minmax(0,1fr);gap:6px 10px;align-items:start}
.wnotes label{font-size:.875rem;color:var(--muted);padding-top:5px}
.wnotes textarea{font:inherit;font-size:.875rem;resize:vertical;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--plane);color:var(--fg)}
.wlevel{font-size:.875rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wlevel select, .wlevel input{font:inherit;font-size:.875rem;padding:2px 6px;border:1px solid var(--ring);border-radius:6px;background:var(--card);color:var(--fg)}
.wlevel input{width:3.5em}
.wbar{display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:.875rem;color:var(--muted)}
.wbar .btn{margin-left:auto}
.wmsg{color:var(--serious);font-size:.8125rem;text-align:right;margin-top:6px}
.wprog{margin-top:14px}
.wrun{cursor:pointer;font-size:.875rem;padding:4px 0}
.wrun:hover{color:var(--accent)}
.aitems tr[data-href]{cursor:pointer}
.aitems tr[data-href]:hover{background:var(--plane)}
.wnew .setopt input{font:inherit;width:100%;padding:4px 8px;border:1px solid var(--ring);border-radius:8px;background:var(--card);color:var(--fg);margin-top:4px}
.devdet{background:var(--plane);border-radius:10px;padding:8px 14px;margin-bottom:14px}
/* 想法 → 需求 → 蓝图（09-27）：模块的「需求」页、一个想法的页、开工单先选模块 */
.nlead{font-size:1.0625rem;font-weight:600;margin:4px 0 6px}
.nacts{margin:10px 0 4px;display:flex;gap:6px;flex-wrap:wrap}
.ntab th{text-align:left;font-weight:500;color:var(--muted);font-size:.75rem;padding:4px 6px}
.nbad{color:var(--serious)}
.nwarn{color:var(--warn)}
.nidea{margin:8px 0;padding:8px 14px;border-left:3px solid var(--accent);background:var(--plane);border-radius:0 8px 8px 0;font-size:1rem}
.ncand{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.ncand .btn{flex:none}
.wnew textarea{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--ring);border-radius:8px;background:var(--card);color:var(--fg);margin-bottom:6px}
.wnew select{font:inherit;padding:2px 6px;border:1px solid var(--ring);border-radius:6px;background:var(--card);color:var(--fg)}
.wmods{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.wopt.on{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wfw{margin-top:10px;font-size:.875rem}
.wfw summary{cursor:pointer;color:var(--muted)}
.wchip.wfix{padding-right:8px}
#nidea.on{color:var(--accent);border-color:var(--accent)}
/* 问答分两边：agent 问你 · 你问 agent */
.qah{font-size:.8125rem;font-weight:600;color:var(--fg);margin:14px 0 2px;padding-top:8px;border-top:1px solid var(--line)}
.qah:first-child{margin-top:0;padding-top:0;border-top:0}
.qawhere{width:100%;font:inherit;font-size:.875rem;padding:4px 8px;border:1px solid var(--ring);border-radius:8px;background:var(--card);color:var(--fg);margin:6px 0}
.qaans{background:var(--plane);border-radius:10px;padding:10px 14px;margin-top:10px}
#qaAsk{width:100%;min-height:4.5rem;flex:none}
/* 下载清单：一篇一行，绿 = 下好了 */
.dlbar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.dlbar input{font:inherit;font-size:.875rem;padding:4px 8px;border:1px solid var(--ring);border-radius:8px;background:var(--card);color:var(--fg);flex:1 1 14em;min-width:0}
/* 下载清单：照作者 V3 那份的样子（09-28）——进度、按出版社分组、每篇一张卡 */
.dlhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:8px 0 4px}
.dlhead .hint b{color:var(--fg);font-size:1.05rem}

/* 文献库：一篇一行；信息页 */

.rdnew{display:flex;gap:6px;align-items:flex-end;margin:4px 0 10px}

.rdnote[data-c="蓝"]{border-color:#2f6fdb}
.rdnote[data-c="黑"]{border-color:#222}
/* 全屏：两栏铺满整个屏幕 */
.rd:fullscreen, .rd.rdfs{height:100vh;padding:12px;background:var(--plane);box-sizing:border-box}
.rd.rdfs{position:fixed;inset:0;z-index:50}
/* 批注：叠在原文上（坐标是 PDF 自己的单位，放大缩小跟着走）；选字时不挡着选字 */
.rdmk{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}
.rdmk .mkhl{mix-blend-mode:multiply;opacity:.4}
.rdmk .mkhit{fill:none;stroke:transparent}
.rdstks{position:absolute;inset:0;z-index:3;pointer-events:none}
.rdstick{position:absolute;pointer-events:auto;max-width:9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:translateY(-100%);
  background:#fffdf5;color:#141413;border-left:4px solid var(--c);font-size:12px;line-height:1.45;padding:2px 7px;border-radius:0 5px 5px 0;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer}
.rdstick.open{white-space:pre-wrap;max-width:18em;z-index:4}
.rd[data-tool="笔"] .rdmk, .rd[data-tool="便签"] .rdmk{pointer-events:all;touch-action:none}
.rd[data-tool="笔"] .rdmk{cursor:crosshair}
.rd[data-tool="便签"] .rdmk{cursor:copy}
.rd[data-tool="笔"] .rdpages, .rd[data-tool="便签"] .rdpages, .rd[data-tool="橡皮"] .rdpages{user-select:none}
.rd[data-tool="橡皮"] .rdmk [data-mk] *{pointer-events:visiblePainted;cursor:pointer}
.rd[data-tool="橡皮"] [data-mk]:hover{opacity:.3}
.textLayer{position:absolute;text-align:initial;inset:0;overflow:clip;opacity:1;line-height:1;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:0;
  --min-font-size:1;--text-scale-factor:calc(var(--total-scale-factor) * var(--min-font-size));--min-font-size-inv:calc(1 / var(--min-font-size))}
.textLayer :is(span, br){color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer > :not(.markedContent), .textLayer .markedContent span:not(.markedContent){z-index:1;--font-height:0;font-size:calc(var(--text-scale-factor) * var(--font-height));
  --scale-x:1;--rotate:0deg;transform:rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv))}
.textLayer .markedContent{display:contents}
.textLayer ::selection{background:rgba(0, 90, 255, .28)}
.textLayer br::selection{background:transparent}
.libtab tr[data-paper]:hover{background:var(--plane)}
.libprob{font-size:.8125rem;color:var(--serious);margin:6px 0}
.libkv{margin:10px 0 14px}
.libkv a{cursor:pointer}
.dlbar select{font:inherit;font-size:.875rem;padding:4px 8px;border:1px solid var(--ring);border-radius:8px;background:var(--card);color:var(--fg)}
.devdet .chk{display:flex;gap:6px;align-items:baseline;padding:3px 0;font-size:.875rem}
.devdet .chk a{margin-left:6px;white-space:nowrap}
.mpill{font-size:.8125rem;font-weight:400;padding:2px 10px;border-radius:8px;margin-left:10px;vertical-align:middle;white-space:nowrap}
.mpill.ok{background:color-mix(in srgb, var(--good) 16%, transparent);color:var(--good)}
.mpill.warn{background:color-mix(in srgb, var(--warn) 18%, transparent);color:var(--warn)}
.mpill.bad{background:color-mix(in srgb, var(--serious) 14%, transparent);color:var(--serious)}
.mpill.run{background:color-mix(in srgb, var(--accent) 14%, transparent);color:var(--accent)}
.aitems{width:100%;font-size:.8125rem;margin-top:10px;border-collapse:collapse}

.ordf .os{display:flex;align-items:baseline;gap:6px;padding:3px 0 3px 2.2em;font-size:.875rem}

.jacts textarea{width:100%;min-height:3.5rem;font:inherit;font-size:.875rem;padding:6px 8px;border:1px solid var(--ring);border-radius:8px;background:var(--card);color:var(--fg);margin:6px 0}
.autoline{display:inline-flex;align-items:center;margin:-8px 0 14px;padding:5px 12px;border:1px solid var(--ring);border-radius:999px;
  font-size:.8125rem;color:var(--fg2);background:var(--card);text-decoration:none}
.autoline[hidden]{display:none}
.autoline:hover{border-color:var(--accent);color:var(--accent)}
.setopt{display:block;margin:8px 0;font-size:.875rem;cursor:pointer}
/* 设置 → 模块：一行一个模块 */
.setmods td{vertical-align:middle}
.setmods input[type=text]{width:100%;font:inherit;font-size:.8125rem;padding:4px 8px;border:1px solid var(--ring);
  border-radius:7px;background:var(--plane);color:var(--fg);outline:none}

.builtin-file{display:inline-flex;align-items:center;flex-shrink:0}

.builtin-lock svg{width:1rem;height:1rem;flex:none}.builtin-lock span{font-size:.75rem}

.bi-mark-list{display:grid;gap:.35rem;margin-top:.5rem}.bi-mark-row{display:flex;align-items:center;gap:.5rem;padding:.4rem 0;border-bottom:1px solid var(--ring)}.bi-mark-row .bi-path{flex:1;min-width:0;font-size:.8rem}.bi-mark-list .hint{font-size:.75rem}

#biDialog{width:min(1040px,90vw);max-height:88vh;box-sizing:border-box;padding:1.2rem;border:1px solid var(--ring);border-radius:12px;background:var(--card);color:var(--fg);box-shadow:0 12px 40px rgba(0,0,0,.25)}

.kv select,.kv input[type=text]{font:inherit;font-size:.8125rem}

.rwdiff{font-family:var(--mono);font-size:.75rem;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-height:60vh;overflow:auto}
/* 清理 → 重生（S1-8 S2-64）：全量备份的进度条，百分比标在条上 */
.rbbar{position:relative;height:22px;border-radius:11px;background:var(--plane);border:1px solid var(--ring);overflow:hidden;max-width:40rem;margin:10px 0 6px}

.mono{font-family:var(--mono);font-size:.92em}
aside .row .meta.nb{background:var(--crit);color:#fff;border-radius:99px;padding:0 7px;font-family:var(--mono)}

   说明文字都收进按钮的悬停提示，快捷指令收进「＋ 快捷」。浮窗能拖（抓上面那行）、能缩（拉右下角），位置大小记在本机 */

<script>
/* ---- 顶栏高度实测写进 CSS 变量 --------------------------------
   字号一变、横向滚动条一出一收，顶栏高度就变（实测 125↔141px）。
   写死像素侧栏必然错位。
   坑：只挂 ResizeObserver 不够 —— 实测拉宽窗口时它没触发，
   值停在旧的。所以多挂几个触发点，宁可多算几次。
   --------------------------------------------------------------- */
const nav = document.getElementById('nav');
function syncNavH() {
  const h = Math.round(nav.getBoundingClientRect().height);
  document.documentElement.style.setProperty('--navh', h + 'px');
}
function syncSoon() { requestAnimationFrame(function () { syncNavH(); syncToolsW(); }); }
/* 工具条实际多宽，写进变量：lane 靠它留空位，右箭头靠它避让 */
function syncToolsW() {
  const t = document.getElementById('tools');
  if (t) document.documentElement.style.setProperty('--toolsw', Math.ceil(t.getBoundingClientRect().width) + 'px');
}
syncNavH(); syncToolsW();
addEventListener('resize', syncSoon);
addEventListener('load', syncSoon);
new ResizeObserver(syncSoon).observe(nav);
/* 工具条自己也要盯：改字号时它变宽，但 nav 高度可能不变，
   只盯 nav 的话 --toolsw 会停在旧值（实测差过 38px，内容会钻到工具条底下） */
const toolsEl = document.getElementById('tools');
if (toolsEl) new ResizeObserver(syncSoon).observe(toolsEl);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncSoon);  // 字体加载完高度会变

/* ================= 每条 lane 的横滑 ==========================
   中间那条承载项目，会越加越长，必须让人一眼看出「右边还有」。
   三样：左右箭头（只在能滚时出现）· 点箭头滑一屏 · 滚轮直接横滚。
   ============================================================ */
document.querySelectorAll('.laneBox').forEach(function (box) {
  const lane = box.querySelector('.lane');
  const L = box.querySelector('.arr.l'), R = box.querySelector('.arr.r');

  function refresh() {
    const max = lane.scrollWidth - lane.clientWidth;
    L.classList.toggle('show', lane.scrollLeft > 4);
    R.classList.toggle('show', lane.scrollLeft < max - 4);
  }
  function slide(dir) { lane.scrollLeft += dir * Math.max(120, lane.clientWidth * .7); }

  L.onclick = function () { slide(-1); };
  R.onclick = function () { slide(1); };
  lane.addEventListener('scroll', refresh, { passive: true });

  /* 滚轮横滚：在这一条上滚鼠标，直接左右走，不用去够滚动条 */
  lane.addEventListener('wheel', function (e) {
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;   // 本来就是横向手势，交给浏览器
    if (lane.scrollWidth <= lane.clientWidth) return;        // 没得滚就别拦
    e.preventDefault();
    lane.scrollLeft += e.deltaY;
  }, { passive: false });

  new ResizeObserver(refresh).observe(lane);
  /* 内容变了（模块加减、数据重画）lane 本身尺寸不变，ResizeObserver 不会响，要另外盯 */
  new MutationObserver(refresh).observe(lane, { childList: true, subtree: true });
  addEventListener('resize', refresh);
  refresh();
  setTimeout(refresh, 60);        // 字体加载完宽度会变
});

/* 走到哪扫到哪（S1-8 S2-43；作者 10-02「像我玩游戏一样，走到哪里就扫描到哪里」）：
   换页、切走切回都告诉后台在看哪；后台说这页对应哪几片（MYAREAS）、哪几片有变动还没扫（DIRTY，第二栏亮小点）、正在扫大片（SCANBUSY） */
let MYAREAS = [], DIRTY = {}, SCANBUSY = '';

function scanRoot() { return S && S.project ? String(S.project.root || '').replace(/\\/g, '/') : ''; }
function resetScanState() {
  ++SCANEPOCH; SCANBUSY = ''; SCANLEGACY = false;

function handleScanMessage(m, connection) {
  if (connection !== ws || connection.readyState !== 1 || !scanRoot()) return false;
  if (m.project && String(m.project).replace(/\\/g, '/') !== scanRoot()) return false;
  ++SCANEPOCH;
  const active = typeof m.active === 'boolean' ? m.active : (m.areas || []).length > 0;
  SCANLEGACY = typeof m.active !== 'boolean';
  SCANBUSY = active ? (m.areas || []).join('、') : '';
  if (window.PaneSpirit) window.PaneSpirit.scan(active);

}
async function syncScanState(connection) {

  try {
    const d = await api('GET', 'api/scan');
    if (connection !== ws || connection.readyState !== 1 || epoch !== SCANEPOCH || root !== scanRoot()) return;
    handleScanMessage({active: !!(d.busy || []).length, areas: d.busy || [], project: d.project}, connection);

}

   网页里写着它是哪个版本（后台塞进去的 rc-ui）；后台说现在的网页已经不是这个版本了（改过了），就自己刷新。

const UIV = (document.querySelector('meta[name=rc-ui]') || {}).content || null;

  if (!UIV || !v || v === UIV || UIRELOAD) return;

  (function tryReload() {

function connectWS() {
  if (!CAN_ONLINE) return;
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  const connection = ws;
  ws.onmessage = function (e) {
    if (connection !== ws) return;
    let m; try { m = JSON.parse(e.data); } catch (_) { return; }
    if (m.ui) uiCheck(m.ui);                // 网页改过了：停手后自己刷新
    if (m.type === 'ui') return;
    if (m.type === 'supervise') {         // 监管记下了新的：开着总览就重画
      if (view === 'auto' && AUSEL === 's:home' && !autoTyping()) queueAutoRefresh();
      return;
    }
    if ((m.type==='changed'||m.type==='hello') && view==='auto') queueAutoRefresh();
    if (m.type === 'tasks') {             // 后台任务表变了（agent 的会话记录长了）：总览里那一块、看全过程那页跟着变
      if (view === 'auto' && !autoTyping()) { if (AUSEL === 's:home') queueAutoRefresh(); else if (/^t:/.test(AUSEL)) queueAutoRefresh(); }
      return;

    if (m.type === 'focus') { MYAREAS = m.areas || []; DIRTY = m.dirty || {}; markDirty(); return; }   // 后台回：这页对应哪几片
    if (m.type === 'dirty') {             // 冷的地方有变动：只亮小点，不重拉
      DIRTY = m.dirty || {}; markDirty();
      if (view === 'settings') loadScan(true);
      return;
    }
    if (m.type === 'scanning') { handleScanMessage(m, connection); return; }
    if (m.type === 'files') {             // 项目里有文件加、删、改：带着哪几片。跟这页有关才重画这页；无关只更新第二栏的数和小点
      Object.keys(PCACHE).forEach(function (k) { delete PCACHE[k]; });
      if (m.dirty) DIRTY = m.dirty;
      if (SCANLEGACY) resetScanState();       // 兼容只有开始事件的旧后端；新事件用明确结束收尾。
      const mine = !m.areas || view === 'search' || m.areas.some(function (a) { return MYAREAS.indexOf(a) >= 0 || a === '资料' || a === '根目录'; });
      if (mine) load().then(refreshView); else load();
      if (view === 'settings') loadScan(true);

       当前这页的目录也要重拉——后端关着的时候，文件可能变了 */
    if (!online) { load().then(refreshView); return; }
    if (!S || m.v !== S.v) load();

  };
}

function bindBusinessNavHandle(lane,handle,projectRoot){
  const root=String(projectRoot||'').replace(/\\/g,'/').replace(/\/+$/,'').toLowerCase(),key='tpl_business_nav:'+root;
  let scale=1,drag=null,disposed=false;try{const saved=Number(localStorage.getItem(key));if(Number.isFinite(saved)&&saved>=1&&saved<=1.6)scale=saved;}catch(_){}
  const events=[];
  function listen(target,name,fn){target.addEventListener(name,fn);events.push([target,name,fn]);}
  function apply(value,save){scale=Math.min(1.6,Math.max(1,Math.round(value*1000)/1000));lane.style.setProperty('--business-scale',String(scale));if(handle)handle.setAttribute('aria-valuenow',String(Math.round(scale*100)));if(save)try{localStorage.setItem(key,String(scale));}catch(_){} }

    handle.setAttribute('role','slider');handle.setAttribute('aria-orientation','horizontal');handle.setAttribute('aria-valuemin','100');handle.setAttribute('aria-valuemax','160');
    handle.setAttribute('aria-label',getLang()==='en'?'Business module width. Drag left to stretch; Home to reset.':'业务模块宽度；向左拖动拉伸，Home复位');handle.setAttribute('aria-valuenow',String(Math.round(scale*100)));

    listen(handle,'pointermove',e=>{if(!drag||drag.id!==e.pointerId||disposed)return;e.preventDefault();apply(drag.scale+(drag.x-e.clientX)/260,true);});

    listen(handle,'dblclick',e=>{e.preventDefault();finish(false);apply(1,true);finish(true);});
    listen(handle,'keydown',e=>{let value=scale;if(e.key==='Home')value=1;else if(e.key==='End')value=1.6;else if(e.key==='ArrowLeft')value+=e.shiftKey?.1:.02;else if(e.key==='ArrowRight')value-=e.shiftKey?.1:.02;else return;e.preventDefault();finish(false);apply(value,true);finish(true);});

  const d = k === 'plans' ? 'time' : 'struct';
  try { const v = JSON.parse(localStorage.getItem(ORDKEY) || '{}')[k]; return v === 'time' || v === 'struct' ? v : d; } catch (e) { return d; }
}
function ordSet(k, v) { try { const o = JSON.parse(localStorage.getItem(ORDKEY) || '{}'); o[k] = v; localStorage.setItem(ORDKEY, JSON.stringify(o)); } catch (e) {} }
function ordSeg(k) {
  const v = ordGet(k);
  return '<div class="ordseg" data-ordk="' + esc(k) + '"><button data-ord="struct"' + (v === 'struct' ? ' class="on"' : '') + '>结构 <span class="en">Structure</span></button>'
    + '<button data-ord="time"' + (v === 'time' ? ' class="on"' : '') + '>时间 <span class="en">Time</span></button></div>';
}
function dayName(d) {                            // 2026-10-01 → 今天 · 昨天 · 09-29（不是今年的写全）
  const iso = function (x) { return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
  const t = new Date();
  if (d === iso(t)) return '今天';
  t.setDate(t.getDate() - 1);
  if (d === iso(t)) return '昨天';
  return d.slice(0, 4) === String(new Date().getFullYear()) ? d.slice(5) : d;
}
function treeByTime(t) {                         // 目录摊平：[{n, where}]，新的在前；网页自己列的条目（没有文件时间）排最后
  const out = [], seen = new Set();
  const walk = function (items, where) {
    (items || []).forEach(function (n) {
      if (n.dir) { walk(n.children, (where ? where + ' / ' : '') + n.name); return; }
      if (!seen.has(n.path)) { seen.add(n.path); out.push({ n: n, where: where }); }
      walk(n.sub, where);
    });
  };
  if (t.sections) t.sections.forEach(function (s) { walk(s.items, s.title); }); else walk(t.items, '');
  return out.sort(function (a, b) { const x = a.n.mtime || '', y = b.n.mtime || ''; return x < y ? 1 : x > y ? -1 : 0; });
}
function timeNodes(list) {
  let day = null;
  return list.map(function (x) {
    const n = x.n, d = n.mtime ? n.mtime.slice(0, 10) : '';
    const h = d !== day ? '<div class="h">' + esc(d ? dayName(d) : '没记时间') + '</div>' : '';
    day = d;
    const nm = n.label || n.name.replace(/\.md$/i, '');
    return h + '<div class="fi' + (MV.sel === n.path ? ' on' : '') + '" data-file="' + esc(n.path) + '"><span class="tm">' + esc(n.mtime ? n.mtime.slice(11, 16) : '') + '</span>'
      + '<span class="nm" title="' + esc(n.name) + '">' + esc(nm) + (n.en ? ' <span class="en">' + esc(n.en) + '</span>' : '') + '</span><span class="meta">' + esc(x.where || n.note || '') + '</span></div>';
  }).join('');
}
function renderTree(m) {
  const overviewPath=moduleOverviewPath(m.name);
  function withoutOverview(items){return(items||[]).filter(function(n){return !(n.virtual && n.path===overviewPath);}).map(function(n){return Object.assign({},n,n.children?{children:withoutOverview(n.children)}:{},n.sub?{sub:withoutOverview(n.sub)}:{});});}
  const t=Object.assign({},MV.tree,{items:withoutOverview(MV.tree.items)},MV.tree.sections?{sections:MV.tree.sections.map(function(sec){return Object.assign({},sec,{items:withoutOverview(sec.items)});})}:{});
  const SEC = { '总的': 'Main', '目录': 'Contents', '其它': 'Other', '总蓝图': 'Framework', '总戒律': 'Framework', '模块': 'Modules',
    '待整理': 'To sort', '等你改总的': 'For you', '变成了需求': 'Needs', '变成了戒律': 'Rules', '放一放': 'Later', '不要': 'Dropped', '文献': 'Papers', '工作台':'Workspace', '其他材料':'Other materials', '内置':'Built-in' };
  const ord = ordGet('m:' + m.name), byTime = ord === 'time' ? treeByTime(t) : null;
  const body = byTime ? (byTime.length ? timeNodes(byTime) : '<div class="none">空的。把文件放进 资料/' + esc(m.name) + '/，这里会自己出现。</div>')
    : t.sections
    ? t.sections.map(function (s) {
        if(s.title==='目录'&&(m.name==='文献'||m.name==='PPT'||m.name==='宣传片'))return nodes([{dir:true,name:getLang()==='en'?'Files':'文件目录',path:'#module-files',children:s.items}],true);
        return '<div class="h">' + esc(s.title) + ' <span class="en">' + (SEC[s.title] || '') + '</span></div>' + nodes(s.items, true);
      }).join('')
    : (t.items.length ? nodes(t.items) : '<div class="none">空的。把文件放进 资料/' + esc(m.name) + '/，这里会自己出现。</div>');
  $('#tree').innerHTML = '<div class="mh">' + label(m)
    + '<span class="p">资料/' + esc(m.name) + '/ · ' + m.files + ' 个文件 · ' + fmtSize(m.bytes) + '</span></div>'
    + (moduleOverviewEnabled(m.name)?nodes([{path:overviewPath,name:'总览',label:'总览',en:'Overview',virtual:true}],true):'') + ordSeg('m:' + m.name) + (m.name==='源代码'?nodes([{path:CODELIST,name:'代码清单',label:'代码清单',en:'Code list',virtual:true},{path:WORKBENCH,name:'编程工作台',label:'编程工作台',en:'Coding workbench',virtual:true}],true):'') + body + (t.truncated ? '<div class="none">文件太多，只列了前 3000 个</div>' : '');
}
/* 分段时：名字去掉 .md、用给的 label；右边写「做完 3/8」「16 条」这类，不写大小时间 */
function nodes(items, outline) {
  return items.map(function (n) {
    if (outline && !n.dir) {
      const nm = n.label || n.name.replace(/\.md$/i, '');
      const row = '<div class="fi' + (MV.sel === n.path ? ' on' : '') + '" data-file="' + esc(n.path) + '"><span class="car"></span>'
        + '<span class="nm" title="' + esc(n.name) + '">' + esc(nm) + (n.en ? ' <span class="en">' + esc(n.en) + '</span>' : '') + (n.link && !n.label ? '<span class="lk">链接</span>' : '') + '</span>'
        + '<span class="meta">' + esc(n.note || (n.virtual ? '' : fmtTime(n.mtime))) + '</span></div>';
      return row + (n.sub ? '<div class="fkids">' + nodes(n.sub, true) + '</div>' : '');
    }
    const lk = n.link ? '<span class="lk">链接</span>' : '';
    if (n.dir) {
      const open = MV.open.has(n.path);
      return '<div class="fi dir" data-dir="' + esc(n.path) + '"><span class="car">' + (open ? '▾' : '▸') + '</span>'
        + '<span class="nm">' + esc(n.name) + lk + '</span><span class="meta">' + fmtTime(n.mtime) + '</span></div>'
        + '<div class="fkids"' + (open ? '' : ' hidden') + '>' + nodes(n.children) + '</div>';
    }
    return '<div class="fi' + (MV.sel === n.path ? ' on' : '') + '" data-file="' + esc(n.path) + '"><span class="car"></span>'
      + '<span class="nm" title="' + esc(n.name) + '">' + esc(n.name) + lk + '</span>'
      + '<span class="meta">' + fmtSize(n.size) + ' · ' + fmtTime(n.mtime) + '</span></div>';
  }).join('');
}
$('#tree').addEventListener('click', function (e) {
  const o = e.target.closest('.ordseg button');
  if (o) {
    ordSet(o.parentNode.dataset.ordk, o.dataset.ord);
    const m = S && S.modules.find(function (x) { return x.name === cur; });
    if (m && MV.tree) renderTree(m);
    return;
  }
  const r = e.target.closest('.fi');
  if (!r) return;
  if (r.dataset.dir !== undefined) {
    const p = r.dataset.dir, k = r.nextElementSibling;
    if (MV.open.has(p)) MV.open.delete(p); else MV.open.add(p);
    k.hidden = !k.hidden;
    r.firstChild.textContent = k.hidden ? '▸' : '▾';
    r.setAttribute('aria-expanded', String(!k.hidden));
    return;
  }
  openItem(r.dataset.file);
});

async function showFile(path,quiet) {
  if(typeof fileDeleteProjectChanged==='function')fileDeleteProjectChanged();
  if(typeof fileDeleteRelease==='function')fileDeleteRelease();
  const name=cur;
  if(view!=='mod'||!name||!online)return;
  if(MV.shown&&MV.shown!==path)ZPOS[zkey(name,MV.shown)]=scrollY;
  MV.sel=path;
  $('#tree').querySelectorAll('.fi.on').forEach(x=>x.classList.remove('on'));
  const row=Array.from($('#tree').querySelectorAll('.fi[data-file]')).find(x=>x.dataset.file===path);if(row)row.classList.add('on');
  const tx=moduleReadBegin(path,'正在读取预览资料','Reading preview data'),ck=modulePreviewKey(name,path,tx.root),pre=PCACHE[ck];
  delete PCACHE[ck];
  let p,pv,html,fingerprint;
  try{
    p=await(pre||api('GET','api/modules/'+encodeURIComponent(name)+'/preview?path='+encodeURIComponent(path)));
    if(!moduleReadCurrent(tx)){moduleReadDrop(tx);return;}
    if(!p||typeof p!=='object')throw new Error('没有收到预览资料');
    fingerprint=JSON.stringify(p);
    const url=rawUrl(name,path);pv=previewBody(p,url,shown(path));
    html='<div class="ph"><span class="path">'+esc(shown(path))+'</span>'
      +'<span class="meta">'+fmtSize(p.size)+' · '+fmtTime(p.mtime)+'</span>'
      +'<span class="acts"><button class="sbtn" id="treeTgl">'+($('#tree').classList.contains('hide')?'显示目录':'收起目录')+'</button>'
      +'<button class="sbtn sticky-shortcut" id="cite" aria-label="便签 Sticky note" title="便签 Sticky note">' + stickyNoteIcon() + '便签 <span class="en">Sticky note</span></button>'
      +builtinFileSlot(shown(path),'',p.builtin_action)
      +(typeof fileDeleteButton==='function'?fileDeleteButton(p.delete_action):'')
      +(/^(治理\/(目标|需求|戒律|任务|计划)\/|资料\/蓝图\/S|资料\/戒律\/[123] |资料\/[^/]+\/(需求|蓝图|戒律)\.md)/.test(shown(path))?govButton(shown(path)):'')
      +'<button class="sbtn" data-pvfull>全屏</button>'
      +(OPENABLE_KINDS.indexOf(p.kind)>=0?'<button class="sbtn" id="openLocal">用本机软件打开</button>':'')
      +'<a class="sbtn" href="'+url+'" target="_blank" rel="noopener">新标签打开</a></span></div>'+pvWrap(pv.body,shown(path));
    if(!await moduleReadComplete(tx))return;
  }catch(error){moduleReadFailure(tx,error,quiet);return moduleReadResult(tx,'preview-metadata',false);}
  if(!moduleReadCurrent(tx))return;
  act(ACT.viewed,shown(path));fileHash(path);tx.hash=location.hash;LASTFILE[name]=path;
  const mv=tx.host;
  if(!moduleReadSamePage(tx,'preview',fingerprint)){
    mv.classList.toggle('wide',pv.wide);mv.innerHTML=html;landOn(name,path);
    $('#cite').onclick=()=>appendNote('关于「'+shown(path)+'」：');
    if($('#openLocal'))$('#openLocal').onclick=()=>openLocal(name,path);
    $('#treeTgl').onclick=function(){const hidden=$('#tree').classList.toggle('hide');this.textContent=hidden?'显示目录':'收起目录';};
    moduleReadRemember(tx,'preview',fingerprint);
  }
  if(typeof fileDeleteBind==='function')fileDeleteBind(mv,p.delete_action,'module',path,name,MODULE_READ.serial);
  // This is preview metadata only. iframe/image/video/PDF/Office readiness stays with its real component.
  return moduleReadResult(tx,'preview-metadata',true);
}

let CMAPCTL = null;
function cmapView() { try { return localStorage.getItem('tpl_cmap_view') || 'map'; } catch (e) { return 'map'; } }
/* 模块读取入口 showCodemap */
async function showCodemap(forceList) {
  const mapPath=forceList?CODELIST:CODEMAP,name=cur;
  if(view!=='mod'||!name||!online)return;
  if(MV.shown&&MV.shown!==mapPath)ZPOS[zkey(name,MV.shown)]=scrollY;
  MV.sel=mapPath;
  $('#tree').querySelectorAll('.fi.on').forEach(x=>x.classList.remove('on'));
  const row=Array.from($('#tree').querySelectorAll('.fi[data-file]')).find(x=>x.dataset.file===mapPath);if(row)row.classList.add('on');
  const mv=$('#modview');
  if(!forceList&&window.CodeMap){
    let ctl=CMAPCTL,meta=ctl&&MODULE_CMAP_META.get(ctl),created=false;
    const reusable=ctl&&meta&&meta.root===moduleReadRoot()&&meta.host===mv&&ctl.module===name&&ctl.alive()&&
      meta.box.isConnected&&mv.contains(meta.box)&&!!meta.box.querySelector('.cmx-stage');
    if(!reusable){
      if(CMAPCTL)CMAPCTL.destroy();CMAPCTL=null;
      fileHash(mapPath);mv.classList.add('wide');mv.innerHTML=cmapHead('map')+'<div id="cmapBox"></div>';
      landOn(name,mapPath);cmapWire(name);created=true;
    }
    const tx=moduleReadBegin(mapPath,'正在读取代码地图目录','Reading code map directory');
    try{
      if(created){
        ctl=CodeMap.mount($('#cmapBox'),{module:name,api:api,toast:toast,notes:overviewNotes,notesIcon:stickyNoteIcon,
          open:function(path){invalidateModuleReading();if(CMAPCTL===ctl){ctl.destroy();CMAPCTL=null;}openItem(path);}});
        CMAPCTL=ctl;
        if(!ctl||!ctl.ready||typeof ctl.ready.then!=='function')throw new Error('代码地图没有返回读取状态');
        meta={root:tx.root,host:mv,box:$('#cmapBox'),pending:true,ready:null};
        meta.ready=Promise.resolve(ctl.ready).then(result=>{meta.pending=false;return result;});MODULE_CMAP_META.set(ctl,meta);
      }
      // Pending first load reuses the original ready; refresh is never a substitute for it.
      const result=await(meta.pending?meta.ready:ctl.refresh());
      if(!moduleReadCurrent(tx)){moduleReadDrop(tx);return;}
      if(!result||result.ok!==true||result.module!==name){
        if(result&&(result.stale||result.destroyed)){moduleReadDrop(tx);return moduleReadResult(tx,'codemap-directory',false);}
        throw new Error(result&&result.error||'代码地图读取失败');
      }
      const alive=()=>CMAPCTL===ctl&&MODULE_CMAP_META.get(ctl)===meta&&meta.root===moduleReadRoot()&&
        ctl.alive()&&meta.box.isConnected&&mv.contains(meta.box)&&!!meta.box.querySelector('.cmx-stage');
      if(!await moduleReadComplete(tx,alive))return;
      act(ACT.viewed,name+' · 代码地图');fileHash(mapPath);tx.hash=location.hash;LASTFILE[name]=mapPath;
      return moduleReadResult(tx,'codemap-directory',true);
    }catch(error){moduleReadFailure(tx,error,false);return moduleReadResult(tx,'codemap-directory',false);}
  }
  const tx=moduleReadBegin(mapPath,'正在读取代码清单','Reading code list');let c,html,fingerprint;
  try{
    c=await api('GET','api/modules/'+encodeURIComponent(name)+'/codemap');
    if(!moduleReadCurrent(tx)){moduleReadDrop(tx);return;}
    if(!c||!Array.isArray(c.groups))throw new Error('没有收到代码清单');
    fingerprint=JSON.stringify(c);const n=c.groups.reduce((sum,g)=>sum+g.files.length,0);
    html=cmapHead('list',n+' 个程序文件 · 每句取自文件开头的说明，现场读的')
      +'<p class="hint" style="margin-top:0">出了问题先在这儿找是哪一块，跟 agent 说「是后台的笔记那块」比说「它不动了」准得多。点文件名看代码。</p>'
      +'<div class="cmap">'+c.groups.map(g=>'<h3>'+esc(g.dir?g.dir+'/':'项目根目录')+'</h3><table>'
        +g.files.map(f=>'<tr><td class="cf"><a data-cf="'+esc(f.path)+'">'+esc(f.name)+'</a></td><td>'
          +(f.says?esc(f.says):'<span class="no">（开头没写说明）</span>')+'</td></tr>').join('')+'</table>').join('')+'</div>'
      +(c.truncated?'<p class="hint">文件太多，只列了前 1000 个</p>':'');
    if(!await moduleReadComplete(tx))return;
  }catch(error){moduleReadFailure(tx,error,false);return moduleReadResult(tx,'codemap-list',false);}
  if(!moduleReadCurrent(tx))return;
  act(ACT.viewed,name+' · 代码地图');fileHash(mapPath);tx.hash=location.hash;LASTFILE[name]=mapPath;
  if(!moduleReadSamePage(tx,'codemap-list',fingerprint)){
    mv.classList.remove('wide');if(CMAPCTL){CMAPCTL.destroy();CMAPCTL=null;}
    mv.innerHTML=html;landOn(name,mapPath);
    mv.querySelectorAll('a[data-cf]').forEach(a=>{a.onclick=()=>showFile(a.dataset.cf);});cmapWire(name);
    moduleReadRemember(tx,'codemap-list',fingerprint);
  }
  return moduleReadResult(tx,'codemap-list',true);
}

const WPK={root:null,serial:0,selected:'',query:'',mode:'structure',lang:'zh',plan:'',skillIds:[],catalog:null,catalogError:'',package:null,packageKey:'',fingerprint:'',host:null};
function wpkWords(zh,en){return getLang()==='en'?en:zh;}
function wpkText(value){if(value&&typeof value==='object')return String(value[getLang()==='en'?'en':'zh-CN']||value.zh||value.en||'');return value==null?'':String(value);}
function wpkRoot(value){return String(value===undefined?moduleReadRoot():value).replace(/\\/g,'/').replace(/\/$/,'').toLocaleLowerCase();}
function wpkProjectChanged(){
  const root=wpkRoot();if(root===WPK.root)return;
  ++WPK.serial;WPK.root=root;WPK.selected='';WPK.query='';WPK.mode='structure';WPK.lang='zh';WPK.plan='';WPK.skillIds=[];WPK.catalog=null;WPK.catalogError='';WPK.package=null;WPK.packageKey='';WPK.fingerprint='';WPK.host=null;
}
function wpkTaskIndex(){
  const out=[],seen=new Set();
  ((S&&S.blueprint)||[]).forEach(g=>{if(!g||typeof g.code!=='string'||!Array.isArray(g.subs))return;
    g.subs.forEach(x=>{if(!x||typeof x.code!=='string'||!x.code)return;const key=JSON.stringify([g.code,x.code]);if(seen.has(key))return;seen.add(key);
      out.push({key,goal:g.code,goalName:g.name||'',source:g.file||'',sub:x.code,what:x.what||'',how:x.how||'',state:x.text||''});});});
  return out;
}
function wpkSelection(){return wpkTaskIndex().find(x=>x.key===WPK.selected)||null;}
function wpkSafePath(value){
  if(typeof value!=='string'||!value||/[\\\x00-\x1f\x7f:*?"<>|]/.test(value)||value[0]==='/')return '';
  const parts=value.split('/');if(parts.some(x=>!x||x==='.'||x==='..'||/[. ]$/.test(x)||/^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(?:\.|$)/i.test(x)))return '';
  // Literal percent-encoded module filenames are ordinary project files. Reject encoded path aliases, not Unicode names.
  if(value.includes('%')){let decoded=value;for(let i=0;i<3;i++){let next;try{next=decodeURIComponent(decoded);}catch(_){break;}if(next===decoded)break;if(/[\\\x00-\x1f\x7f:*?"<>|]/.test(next)||next[0]==='/'||next.split('/').length!==parts.length||next.split('/').some(x=>!x||x==='.'||x==='..'||/[. ]$/.test(x)))return '';decoded=next;}}
  return value;
}
function wpkPfile(value){const path=wpkSafePath(value);return path?'pfiles/'+path.split('/').map(encodeURIComponent).join('/'):'';}
function wpkReference(record){
  const doc=record&&record.document,ref=record&&record.ref,path=wpkSafePath(doc&&doc.source||ref&&ref.source||'');
  const revision=String(doc&&doc.revision||ref&&ref.revision||''),state=String(record&&record.reference_state||doc&&doc.state||'missing');
  return '<div class="wpk-ref"><span>'+esc(state)+'</span> '+(path?'<a class="sbtn" href="'+esc(wpkPfile(path))+'" target="_blank" rel="noopener noreferrer">'+esc(path)+'</a>':'<span>'+wpkWords('缺少安全来源','No safe source')+'</span>')
    +(revision?'<small title="SHA-256">'+esc(revision)+'</small>':'<small>'+wpkWords('版本未知','Version unknown')+'</small>')+'</div>';
}
function wpkDocument(record,title,open){
  const doc=record&&record.document,text=doc&&doc.text_loaded?doc.text:record&&typeof record.text==='string'?record.text:'';
  return '<details class="wpk-record"'+(open?' open':'')+'><summary>'+esc(title)+'</summary>'+wpkReference(record)
    +(doc&&doc.truncated?'<p class="wpk-warning">'+wpkWords('正文被截断','Text truncated')+'</p>':'')
    +(doc&&doc.encoding_error?'<p class="wpk-warning">'+wpkWords('正文存在编码问题','Encoding issue')+'</p>':'')
    +(text?'<pre class="wpk-original">'+esc(text)+'</pre>':'<p class="hint">'+wpkWords('没有可读取的正文','No readable original text')+'</p>')+'</details>';
}
function wpkSection(title,html){return '<section class="wpk-section"><h2>'+esc(title)+'</h2>'+html+'</section>';}

    const catalog=WPK.catalog?Promise.resolve(WPK.catalog):api('GET','api/skills/catalog');
    const results=await Promise.allSettled([pending,catalog]);if(!current()){moduleReadDrop(tx);return;}
    if(results[0].status==='rejected')throw results[0].reason;
    const p=results[0].value;if(!p||p.schema!==1||p.read_only!==true||!p.project||wpkRoot(p.project.root)!==WPK.root||!p.request||p.request.goal!==selection.goal||p.request.sub!==selection.sub||typeof p.prompt!=='string')throw new Error(wpkWords('工作包与当前项目或任务不一致','Work package does not match the current project or task'));
    const html=wpkPackageHtml(p),fingerprint=JSON.stringify([p.snapshot&&p.snapshot.digest,p.request,p.readiness,html]);
    if(!await moduleReadComplete(tx,current))return;if(!current())return;
    if(results[1].status==='fulfilled'){WPK.catalog=results[1].value;WPK.catalogError='';}else WPK.catalogError=wpkWords('技能清单读取失败：','Skill catalog read failed: ')+String(results[1].reason&&results[1].reason.message||results[1].reason);

    host.querySelector('[data-wpk-copy]').disabled=!p.prompt;landOn('源代码',WORKBENCH);return moduleReadResult(tx,'work-package',true);
  }catch(error){if(current())moduleReadFailure(tx,error,false);else moduleReadDrop(tx);return moduleReadResult(tx,'work-package',false);}

/* 预览的正文：文字、md 排进页面；图片、PDF、网页嵌进来。模块页和全站检索共用 */
function previewBody(p, url, disp) {
  let body, wide = true;
  if (p.kind === 'text') {
    wide = false;
    if (/\.(md|markdown)$/i.test(p.name)) body = '<article class="md">' + renderMd(p.text, /^(?:技能库\/|资料\/[^/]+\/技能\/)/.test(disp || '') ? disp : undefined) + '</article>';
    else {
      let t = p.text;
      if (/\.json$/i.test(p.name) && !p.truncated) { try { t = JSON.stringify(JSON.parse(t), null, 2); } catch (_) {} }
      body = '<pre class="pv">' + esc(t) + '</pre>';
    }
    if (p.truncated) body += '<p class="hint">文件太大，只显示了前 200 KB。</p>';
    if (p.encoding !== 'utf-8') body += '<p class="hint">编码：' + esc(p.encoding) + '</p>';
  } else if (p.kind === 'image') body = '<img class="pvi" src="' + url + '" alt="">';
  else if (p.kind === 'pdf') body = '<iframe class="pvf" src="' + url + '"></iframe>';
  // 隔离靠服务器发的 sandbox 头；这里再加 sandbox 属性，嵌进去的高度脚本反而跑不起来（实测）
  else if (p.kind === 'html') body = '<iframe class="pvx" scrolling="no" src="' + url + '?embed=1"></iframe>';
  else if (p.kind === 'video') body = '<video class="pvv" controls preload="metadata" src="' + url + '#t=0.1"></video>'   // #t=0.1：先把第一帧画出来，不是一块黑
    + (p.playable ? '' : '<p class="hint">这种格式浏览器多半放不了：装「剪辑」插件能转成 mp4，或者点上面「用本机软件打开」。</p>');
  else if (p.kind === 'audio') body = '<audio class="pva" controls preload="metadata" src="' + url + '"></audio>';
  else if (p.kind === 'pptx') body = pptxBody(p, url);
  else if (p.kind === 'docx' || p.kind === 'xlsx') body = '<div class="pvoff" data-office="' + p.kind + '" data-src="' + url + '"><div class="hint">正在读…</div></div>';
  else if (p.kind === 'zip') { body = zipHead(p.zip) + '<div class="zipv" data-zip="' + esc(p.zip.path || '') + '"></div>'; wide = true; }
  else body = '<div class="empty">这种文件网页里看不了，去资源管理器里打开：' + esc(disp) + '</div>';
  return { body: body, wide: wide };
}

   Word、Excel 用随应用带的小库（T16 docx-preview、T15 SheetJS，在 工具库/下载/，从 /lib/ 加载） */

function pptxText(p, url, q) {

const XL_THEME = ['FFFFFF', '000000', 'E7E6E6', '44546A', '4472C4', 'ED7D31', 'A5A5A5', 'FFC000', '5B9BD5', '70AD47'];
function xlColor(wb, c) {                               // 表格格子的底色：直接写的颜色，或主题色加深浅
  if (!c) return '';

  if (!hex && c.theme != null) {
    const sch = wb.Themes && wb.Themes.themeElements && wb.Themes.themeElements.clrScheme;
    hex = (sch && sch[c.theme] && sch[c.theme].rgb) || XL_THEME[c.theme] || '';
  }
  if (!hex || !/^[0-9a-f]{6}$/i.test(hex)) return '';

function xlShow(el, n) {
  const wb = el.XLWB, name = wb.SheetNames[n], ws = wb.Sheets[name];
  const tabs = wb.SheetNames.length > 1 ? '<div class="xltabs">' + wb.SheetNames.map(function (nm, i) {
    return '<button class="' + (i === n ? 'on' : '') + '" data-xlsheet="' + i + '">' + esc(nm) + '</button>';
  }).join('') + '</div>' : '';
  if (!ws || !ws['!ref']) { el.innerHTML = tabs + '<div class="none">这个表是空的</div>'; return; }
  const r = XLSX.utils.decode_range(ws['!ref']), R1 = Math.min(r.e.r, r.s.r + 2999), C1 = Math.min(r.e.c, r.s.c + 99);
  const skip = new Set(), span = {};
  (ws['!merges'] || []).forEach(function (m) {

    span[m.s.r + ',' + m.s.c] = [er - m.s.r + 1, ec - m.s.c + 1];
    for (let i = m.s.r; i <= er; i++) for (let j = m.s.c; j <= ec; j++) if (i !== m.s.r || j !== m.s.c) skip.add(i + ',' + j);
  });

    for (let j = r.s.c; j <= C1; j++) {
      const key = i + ',' + j;

      const bg = c && c.s && c.s.patternType && c.s.patternType !== 'none' ? xlColor(wb, c.s.fgColor) : '';
      h += '<td' + (sp ? ' rowspan="' + sp[0] + '" colspan="' + sp[1] + '"' : '') + (bg ? ' style="background:' + bg + '"' : '')
        + (c && c.f ? ' title="=' + esc(c.f) + '"' : '') + '>' + (c ? esc(c.w != null ? c.w : String(c.v == null ? '' : c.v)) : '') + '</td>';
    }
    h += '</tr>';
  }
  h += '</tbody></table></div>';
  const more = r.e.r > R1 || r.e.c > C1 ? '<p class="hint">太大了：只显示前 ' + (R1 - r.s.r + 1) + ' 行、' + (C1 - r.s.c + 1) + ' 列；全部的点上面「用本机软件打开」。</p>' : '';

}

/* ---- 目录像文件夹一样能收能展（S1-10 S2-12；作者 10-01：「我觉得目录要有像文件夹一样打开缩小的那种能力，这样就不用一直滚轮了」）----
   每一页左边目录：大块标题（.asec）、分组标题（.h）前面一个小箭头，点了收起 / 展开这一组；收了哪些记在这台电脑的浏览器里。
   工具页没收过的：只展开正在看的那一块。目录每画一次就照记的重新收一遍（MutationObserver），画目录的代码不用改 */
const FOLDKEY = 'tpl_fold';
let FOLD = {};
try { FOLD = JSON.parse(localStorage.getItem(FOLDKEY) || '{}') || {}; } catch (_) {}
function foldName(h) {
  const t = (h.querySelector('.nm') || h).textContent;
  return view + '|' + (h.classList.contains('asec') ? 'A' : 'H') + '|' + t.replace(/^[▸▾]\s*/, '').replace(/\s*·\s*\d+\s*(个|份|件|张)?\s*$/, '').trim();
}
function foldMembers(h) {                       // 这个标题管的那几行：到下一个同级或更高的标题为止
  const out = [], big = h.classList.contains('asec');
  for (let el = h.nextElementSibling; el; el = el.nextElementSibling) {
    if (el.classList.contains('asec') || (!big && el.classList.contains('h'))) break;
    out.push(el);
  }
  return out;
}
function foldShut(h) {
  const k = foldName(h);
  if (k in FOLD) return FOLD[k];
  if (view === 'tools' && h.classList.contains('asec'))                       // 工具页：没收过的，只展开正在看的那一块
    return !h.classList.contains('on') && !foldMembers(h).some(function (el) { return el.matches('.row.on, .fi.on') || !!el.querySelector('.row.on, .fi.on'); });   // 只认选中的那一行（绿灯也叫 on，不算）
  return false;
}
function directoryControls(aside) {
  aside.querySelectorAll('.row,.fi').forEach(function (r) {
    if (r.tagName !== 'DIV' || !Object.keys(r.dataset).length) return;
    r.setAttribute('role', 'button'); r.tabIndex = 0;
    if (r.dataset.dir !== undefined || r.dataset.pdir !== undefined) {
      const kids = r.nextElementSibling; r.setAttribute('aria-expanded', String(!!kids && !kids.hidden));
    }
  });
}
function applyFold(aside) {

  if (!heads.length) return;
  aside.querySelectorAll('.folded').forEach(function (el) { el.classList.remove('folded'); });
  heads.forEach(function (h) {

    control.setAttribute('role', 'button'); control.tabIndex = 0;
    control.setAttribute('aria-expanded', String(!shut));

document.addEventListener('click', function (e) {
  const car = e.target.closest('aside .fold-car'), h = car ? car.parentElement : e.target.closest('aside .h.fold-h');

  e.stopPropagation(); e.preventDefault();      // 点箭头只收放，不当成点了这一块

  try { localStorage.setItem(FOLDKEY, JSON.stringify(FOLD)); } catch (_) {}
  applyFold(h.parentElement);
}, true);
document.querySelectorAll('#toc,#tree,#ptree').forEach(function (a) {

    const r = e.target;
    if (!r.matches('.row[role=button],.fi[role=button],.h.fold-h[role=button],.fold-car[role=button]')) return;
    e.preventDefault(); e.stopPropagation(); r.click();
  });

/* ---- 目录栏（每一页左边那一栏）：右边那条拖着调宽窄，宽度记在这台电脑；小箭头收起 / 展开 ---- */

/* ---- 看压缩包里面（S1-10 S2-11、工具 S2-10；作者 10-01：「工具中的那个开源项目应该也要能查看」）：

function zipHead(z) {
  if (!z) return '';
  const b = BORROW[z.borrow] || ['', ''];
  return '<div class="kv"><span class="k">许可证</span><span><span class="lamp ' + b[0] + '"></span>' + esc((z.license || '没许可证') + ' · ' + b[1]) + '</span>'
    + (z.link ? '<span class="k">链接</span><span><a href="' + esc(z.link) + '" target="_blank" rel="noopener">' + esc(z.link) + '</a></span>' : '')
    + '<span class="k">带什么</span><span>' + esc((z.has || []).join('、') || '—') + '</span>'
    + '<span class="k">大小</span><span>' + fmtSize(z.size) + ' · ' + z.files + ' 个文件</span></div>';
}
function zipTree(items) {                     // 路径 → 一层层的文件夹（<details> 能收能展），文件一行
  const root = { d: {}, f: [] };
  items.forEach(function (x) {
    const parts = x.name.split('/'); let n = root;
    for (let i = 0; i < parts.length - 1; i++) n = n.d[parts[i]] || (n.d[parts[i]] = { d: {}, f: [] });
    n.f.push(x);
  });
  const draw = function (n) {
    return Object.keys(n.d).sort().map(function (k) { return '<details><summary>' + esc(k) + '/</summary>' + draw(n.d[k]) + '</details>'; }).join('')
      + n.f.map(function (x) { return '<span class="zf" data-zf="' + esc(x.name) + '" title="' + esc(x.name + ' · ' + fmtSize(x.size)) + '">' + esc(x.name.split('/').pop()) + '</span>'; }).join('');
  };
  return draw(root);
}
async function mountZip(el) {
  el.dataset.done = '1';
  if (!el.dataset.zip) { el.innerHTML = '<div class="empty">不知道这个压缩包在项目的哪里，看不了里面。</div>'; return; }
  el.innerHTML = '<div class="hint" style="padding:10px">正在读里面…</div>';
  let d;
  try { d = await api('GET', 'api/zip?path=' + encodeURIComponent(el.dataset.zip)); }
  catch (e) { el.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; return; }
  el._items = d.items;
  el.innerHTML = '<div class="ztree"><input type="search" placeholder="找文件（' + d.total + ' 个）">' + '<div class="zlist">' + zipTree(d.items) + '</div>'
    + (d.total > d.items.length ? '<div class="hint">太多了，只列了前 ' + d.items.length + ' 个</div>' : '') + '</div><div class="zfile"><div class="hint">左边点一个文件</div></div>';
  if (d.readme) zipOpen(el, d.readme);
}
async function zipOpen(el, inner) {
  el.querySelectorAll('.zf.on').forEach(function (x) { x.classList.remove('on'); });
  const row = Array.from(el.querySelectorAll('.zf')).find(function (x) { return x.dataset.zf === inner; });
  if (row) { row.classList.add('on'); let p = row.parentElement; while (p && p.tagName === 'DETAILS') { p.open = true; p = p.parentElement; } }
  const box = el.querySelector('.zfile');
  box.innerHTML = '<div class="hint">读着…</div>';
  let f;
  try { f = await api('GET', 'api/zip?path=' + encodeURIComponent(el.dataset.zip) + '&inner=' + encodeURIComponent(inner)); }
  catch (e) { box.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; return; }
  const head = '<div class="zbar"><button class="sbtn" data-ztgl>' + (el.classList.contains('zcol') ? '显示目录' : '收起目录') + '</button><span class="hint">' + esc(inner) + ' · ' + fmtSize(f.size) + '</span></div>';
  if (f.kind === 'image') box.innerHTML = head + '<img class="pvi" src="zfiles?path=' + encodeURIComponent(el.dataset.zip) + '&inner=' + encodeURIComponent(inner) + '" alt="">';
  else if (f.kind === 'text') box.innerHTML = head + (/\.(md|markdown)$/i.test(inner) ? '<article class="md">' + renderMd(f.text) + '</article>' : '<pre class="pv">' + esc(f.text) + '</pre>')
    + (f.truncated ? '<p class="hint">太大了，只显示了前 200 KB。</p>' : '');
  else box.innerHTML = head + '<div class="empty">这种文件网页里看不了（二进制）。</div>';
}
function zipToggle(el) {                       // 目录收起 / 显示（作者 10-01：「全屏的时候那个目录要能收起来」）；全屏时按 [ 也行
  const col = el.classList.toggle('zcol');
