<!doctype html>
<!-- 网页终端（插件，S1-8 S2-48）：几个 PowerShell 窗口一排标签，能看能打字；应用的「自动化 → 窗口」把这一页嵌进去 -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网页终端</title>
<link rel="stylesheet" href="lib/xterm.css">
<style>
:root{--bg:#fafafa;--card:#fff;--fg:#171717;--muted:#6b6b6b;--line:#e5e5e5;--accent:#171717;--on:#fff;--good:#0ca30c;--focus-gold:#a47e39}
:root[data-theme=dark]{--bg:#0a0a0a;--card:#161616;--fg:#ededed;--muted:#a1a1a1;--line:#2a2a2a;--accent:#ededed;--on:#0a0a0a;--focus-gold:#d2b56d}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,"Microsoft YaHei",sans-serif}
.bar{display:flex;gap:4px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.tab{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;font-size:13px}
.tab.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}.tab .dot.off{background:var(--muted)}
.tab .x{border:0;background:none;color:inherit;opacity:.6;cursor:pointer;font-size:14px;padding:0 0 0 2px}
.new{border:1px dashed var(--line);border-radius:8px;background:none;color:var(--muted);padding:4px 10px;cursor:pointer;font-size:13px}
#screens{position:absolute;top:43px;left:0;right:0;bottom:0}
.screen{position:absolute;inset:0;padding:6px;display:none;background:#0c0c0c}.screen.on{display:block}
/* 并排看（作者 10-02「这些agent干活的时候他们的终端都得显示在网页里」）：几个窗口同时铺开，每块上面写是谁 */
body.grid #screens{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));grid-auto-rows:calc((100vh - 55px) / 2);gap:6px;padding:6px;overflow:auto;box-sizing:border-box}
body.grid .screen{position:relative;inset:auto;display:block;padding:22px 6px 6px;border-radius:8px;outline:2px solid transparent}
body.grid .screen.on{outline-color:var(--good)}
body.grid .screen::before{content:attr(data-title);position:absolute;top:3px;left:8px;font-size:12px;color:#bbb}
body.grid .empty{grid-column:1/-1}
.mode{margin-left:auto;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);padding:4px 10px;cursor:pointer;font-size:13px}
.empty{padding:24px;color:var(--muted);line-height:1.7}
.empty code{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.watch-state{margin-left:auto;color:var(--muted);font-size:.8125rem;white-space:nowrap}
body.viewer .new,body.viewer .mode,body.viewer .tab .x{display:none}
body.viewer .screen{overflow:auto}
body.viewer .screen .xterm{min-width:max-content}
body.viewer .tab{cursor:default}
.tab:focus-visible,.new:focus-visible,.mode:focus-visible{outline:2px solid var(--focus-gold);outline-offset:2px}
.tab:hover,.new:hover,.mode:hover{border-color:var(--focus-gold)}
</style>
</head>
<body>
<div class="bar" id="bar"><button class="new" id="new" title="开一个空的 PowerShell 窗口">＋ 新窗口</button><button class="mode" id="mode" title="几个窗口同时铺开看，还是一次看一个">并排看</button><span class="watch-state" id="watchState" hidden></span></div>
<div id="screens"><div class="empty" id="empty">还没有窗口。点「＋ 新窗口」开一个 PowerShell，或者在应用的组织页给某个 agent 点「开工」。</div></div>
<script src="lib/xterm.js"></script>
<script src="lib/addon-fit.js"></script>
<script>
(function () {
  'use strict';
  const params = new URLSearchParams(location.search);
  const T = params.get('t') || '';
  const VIEWER = params.get('view') === '1';
  const q = function (p) { return p + (p.indexOf('?') >= 0 ? '&' : '?') + 't=' + encodeURIComponent(T); };
  const api = function (method, path, body) {
    return fetch(q(path), { method: method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.ok ? r.json() : r.text().then(function (t) { throw new Error(t); }); });
  };
  const theme = params.get('theme');
  const HOST = params.get('p') || '';   // 同时核对来源窗口和 origin，不能只凭消息内容接管
  if (theme) document.documentElement.dataset.theme = theme;
  const HAVE = typeof window.Terminal === 'function';
  const tabs = {};                 // id → {info, tab, screen, term, fit, ws}
  let cur = null;
  let messages = Promise.resolve();
  if (VIEWER) {
    document.body.classList.add('viewer');
    document.getElementById('watchState').hidden = false;
    document.getElementById('empty').textContent = '未选择窗口 No window selected';
  }
  function state(text) { document.getElementById('watchState').textContent = text; }
  function post(message) {
    if (window.parent !== window && HOST) window.parent.postMessage(message, HOST);
  }
  function selectionReply(requestId, ok, error) {
    post({type:'terminal-selected',requestId:requestId,windowId:cur,mode:cur && tabs[cur] ? tabs[cur].mode : 'watch',
      ok:ok,error:error || undefined});
  }
  if (!HAVE) {
    document.getElementById('empty').innerHTML = '画终端要的 xterm.js 还没装：<code>插件/网页终端/lib/</code> 里要有 <code>xterm.js</code>、<code>xterm.css</code>、<code>addon-fit.js</code>，'
      + '装法见 <code>插件/网页终端/插件.md</code>。没装之前窗口照样能开、能在后台跑，只是这里画不出来。';
  }

  function draw(info, mode) {
    if (tabs[info.id]) return tabs[info.id];
    const tab = document.createElement('span');
    tab.className = 'tab';
    tab.innerHTML = '<span class="dot' + (info.alive ? '' : ' off') + '"></span><span class="t"></span><button class="x" title="关掉这个窗口（里面在跑的会停）">×</button>';
    tab.querySelector('.t').textContent = info.title;
    document.getElementById('bar').insertBefore(tab, document.getElementById('new'));
    const screen = document.createElement('div');
    screen.className = 'screen';
    screen.dataset.title = info.title;
    screen.addEventListener('mousedown', function () { show(info.id, true); });
    document.getElementById('screens').appendChild(screen);
    const t = { info: info, tab: tab, screen: screen, mode: mode || (VIEWER ? 'watch' : 'control'), ws:null,
      stopped:false, reconnect:null, seq:-1, first:true };
    tabs[info.id] = t;
    tab.onclick = function (e) { if (!e.target.closest('.x')) show(info.id); };
    tab.querySelector('.x').onclick = function () {
      if (VIEWER) return;
      if (!confirm('关掉「' + info.title + '」？里面在跑的会停。')) return;
      api('POST', '/api/terms/' + info.id + '/close').then(function () { drop(info.id); });
    };
    if (HAVE) {
      t.term = new Terminal({ fontFamily: 'Consolas, "Cascadia Mono", "Microsoft YaHei", monospace', fontSize: 13, cursorBlink: t.mode === 'control',
        disableStdin: t.mode === 'watch', scrollback: 5000,
        theme: { background: '#0c0c0c' } });
      t.fit = new FitAddon.FitAddon();
      t.term.loadAddon(t.fit);
      t.term.open(screen);
      t.term.onData(function (d) { if (t.mode === 'control' && t.ws && t.ws.readyState === 1) t.ws.send(JSON.stringify({ i: d })); });
    }
    if (!VIEWER) connect(t).catch(function (e) { state(e.message); });
    return t;
  }
  async function connect(t) {
    if (t.ws || tabs[t.info.id] !== t) return;
    const capability = await api('GET', '/ping');
    if (tabs[t.info.id] !== t || t.stopped) return;
    if (VIEWER && !(capability.protocol >= 2 && capability.capabilities && capability.capabilities.watch)) {
      const e = new Error('当前终端服务尚未支持只读观看 Terminal service does not support watch mode');
      e.code = 'watch-unsupported'; throw e;
    }
    if (t.ws) return;
    t.structured = capability.protocol >= 2 && capability.capabilities && capability.capabilities.structured;
    t.seq = -1; t.first = true;
    const path = '/ws/' + t.info.id + '?view=' + (t.mode === 'watch' ? '1' : '0') + (t.structured ? '&v=2' : '');
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + q(path));
    t.ws = ws;
    ws.onmessage = function (e) {
      if (t.ws !== ws || !t.term) return;
      if (!t.structured) {
        if (t.first) { t.term.reset(); t.first = false; }
        t.term.write(e.data); return;
      }
      let m; try { m = JSON.parse(e.data); } catch (error) { return; }
      if (m.type === 'history') {
        t.term.reset(); t.seq = m.seq; align(t,m.cols,m.rows); t.term.write(m.data || '');
      } else if (m.type === 'output' && m.seq > t.seq) {
        t.seq = m.seq; t.term.write(m.data || '');
      } else if (m.type === 'size') align(t,m.cols,m.rows);
    };
    ws.onclose = function () {
      if (t.ws !== ws) return;
      t.ws = null;
      if (tabs[t.info.id] === t && !t.stopped) t.reconnect = setTimeout(function () {
        t.reconnect = null;
        connect(t).catch(function (e) { state(e.message); });
      }, 2000);
    };
    return new Promise(function (resolve,reject) {
      ws.addEventListener('open', function () { size(t); resolve(); }, {once:true});
      ws.addEventListener('error', function () { reject(new Error('终端连接失败 Terminal connection failed')); }, {once:true});
      ws.addEventListener('close', function () { if (ws.readyState !== 1) reject(new Error('终端连接已关闭 Terminal connection closed')); }, {once:true});
    });
  }
  function align(t, cols, rows) {
    if (t.mode !== 'watch' || !t.term) return;
    if (Number.isInteger(cols) && Number.isInteger(rows) && cols >= 20 && cols <= 1000 && rows >= 5 && rows <= 500) {
      t.info.cols = cols; t.info.rows = rows; t.term.resize(cols, rows);
    }
  }
  async function disconnect(t) {
    t.stopped = true;
    clearTimeout(t.reconnect); t.reconnect = null;
    const ws = t.ws;
    if (!ws || ws.readyState === 3) { t.ws = null; return; }
    await new Promise(function (resolve,reject) {
      const timer = setTimeout(function () { reject(new Error('正在断开旧连接 Waiting for previous connection')); }, 3000);
      ws.addEventListener('close', function () { clearTimeout(timer); resolve(); }, {once:true});
      ws.close();
    });
    if (t.ws === ws) t.ws = null;
  }
  async function changeMode(t, mode) {
    if (mode !== 'watch' && mode !== 'control') throw new Error('不支持的终端模式 Invalid terminal mode');
    if (t.mode !== mode) {
      await disconnect(t);
      t.mode = mode;
      if (t.term) { t.term.options.disableStdin = mode === 'watch'; t.term.options.cursorBlink = mode === 'control'; }
    }
    t.stopped = false;
    try { await connect(t); }
    catch (error) {
      if (VIEWER && mode === 'control') {
        try { await disconnect(t); } catch (ignore) {}
        t.mode = 'watch';
        if (t.term) { t.term.options.disableStdin = true; t.term.options.cursorBlink = false; }
      }
      throw error;
    }
    state(mode === 'watch' ? '仅观看 Watch only' : '已接管 Input enabled');
  }
  function size(t) {
    if (t.mode === 'watch') { align(t,t.info.cols,t.info.rows); return; } // 观看只对齐本地画面，永不 fit / 改真实 PTY
    if (!t.term || !t.screen.offsetWidth) return;              // 看不见的（一次看一个时别的标签）不量
    try { t.fit.fit(); } catch (e) { return; }
    if (t.term.cols < 20 || t.term.rows < 5) return;          // 窗口还没画出来（在后台、刚打开）：量出来的不算数，别把 PowerShell 挤窄
    if (t.ws && t.ws.readyState === 1) t.ws.send(JSON.stringify({ r: [t.term.cols, t.term.rows] }));
  }
  function show(id, stay) {
    cur = id;
    Object.keys(tabs).forEach(function (k) {
      tabs[k].tab.classList.toggle('on', k === id);
      tabs[k].screen.classList.toggle('on', k === id);
    });
    document.getElementById('empty').style.display = Object.keys(tabs).length ? 'none' : '';
    const t = tabs[id];
    if (t) {
      size(t);
      if (t.term && t.mode === 'control') t.term.focus();
      if (GRID && !stay) t.screen.scrollIntoView({ block: 'nearest' });
    }
  }
  let GRID = false;
  function setGrid(on) {                            // 并排看 / 一次看一个，记在这台电脑的浏览器里
    GRID = on;
    document.body.classList.toggle('grid', on);
    document.getElementById('mode').textContent = on ? '一次看一个' : '并排看';
    if (!VIEWER) try { localStorage.setItem('term_grid', on ? '1' : '0'); } catch (e) {}
    setTimeout(function () { Object.keys(tabs).forEach(function (k) { size(tabs[k]); }); }, 50);
  }
  document.getElementById('mode').onclick = function () { setGrid(!GRID); };
  if (!VIEWER) try { if (localStorage.getItem('term_grid') !== '0') setGrid(true); } catch (e) { setGrid(true); }
  function drop(id) {
    const t = tabs[id];
    if (!t) return;
    delete tabs[id];
    t.stopped = true; clearTimeout(t.reconnect);
    try { t.ws.close(); } catch (e) {}
    if (t.term) t.term.dispose();
    t.tab.remove(); t.screen.remove();
    const left = Object.keys(tabs);
    if (!VIEWER && left.length) show(left[left.length - 1]);
    else { if (cur === id) cur = null; document.getElementById('empty').style.display = ''; }
  }
  function open(title, cmd, metadata) {
    if (VIEWER) return Promise.reject(new Error('观看页不能新建窗口 Watch page cannot open windows'));
    const body = {title:title || '窗口',cmd:cmd || ''};
    ['agent_code','task_key','project_root'].forEach(function (key) { if (metadata && typeof metadata[key] === 'string') body[key] = metadata[key]; });
    return api('POST', '/api/terms', body).then(function (info) { draw(info); show(info.id); return info; });
  }
  function refresh() {
    return api('GET', '/api/terms').then(function (d) {
      const live = d.items.map(function (x) { return x.id; });
      Object.keys(tabs).forEach(function (k) { if (live.indexOf(k) < 0) drop(k); });   // 别处关掉的：这里也收掉
      d.items.forEach(function (info) {
        if (VIEWER && info.id !== cur) return;
        const t = tabs[info.id] || (!VIEWER ? draw(info) : null);
        if (!t) return;
        t.info = info;
        t.tab.querySelector('.dot').classList.toggle('off', !info.alive);
      });
      if (!VIEWER && !cur && d.items.length) show(d.items[d.items.length - 1].id);
      document.getElementById('empty').style.display = cur || (!VIEWER && d.items.length) ? 'none' : '';
      return d.items;
    });
  }
  async function selectWindow(id, mode) {
    if (!id) {
      for (const k of Object.keys(tabs)) { await disconnect(tabs[k]); drop(k); }
      cur = null; state('未选择窗口 No window selected'); return;
    }
    const items = await refresh();
    const info = items.find(function (x) { return x.id === id; });
    if (!info) { const e = new Error('没有这个窗口 Window unavailable'); e.code = 'window-unavailable'; throw e; }
    for (const k of Object.keys(tabs)) if (k !== id) { await disconnect(tabs[k]); drop(k); }
    const t = draw(info, 'watch');
    show(id);
    try { await changeMode(t, mode || 'watch'); }
    catch (e) { state(e.message); throw e; }
  }
  document.getElementById('new').onclick = function () { open('PowerShell', ''); };
  addEventListener('resize', function () { Object.keys(tabs).forEach(function (k) { size(tabs[k]); }); });
  // 应用那边（嵌着这一页的）叫开一个窗口：{type:'open', title, cmd}；换亮暗：{type:'theme', theme}
  addEventListener('message', function (e) {
    if (!HOST || e.origin !== HOST || e.source !== window.parent) return;
    const m = e.data || {};
    if (m.type === 'open' && !VIEWER) open(m.title, m.cmd, m).catch(function (e) { state(e.message); });
    else if (m.type === 'theme') document.documentElement.dataset.theme = m.theme;
    else if (VIEWER && (m.type === 'terminal-select' || m.type === 'terminal-mode')) {
      messages = messages.then(async function () {
        try {
          if (m.type === 'terminal-select') await selectWindow(m.windowId, 'watch');
          else {
            if (!cur || m.windowId !== cur || !tabs[cur]) { const e = new Error('先选择同一窗口 Select the same window first'); e.code = 'window-mismatch'; throw e; }
            await changeMode(tabs[cur], m.mode);
          }
          selectionReply(m.requestId,true);
        } catch (error) { selectionReply(m.requestId,false,{code:error.code || 'terminal-error',message:error.message}); }
      });
    }
  });
  messages = refresh().then(function () { if (VIEWER && params.get('attach')) return selectWindow(params.get('attach'),'watch'); })
    .catch(function (error) { state(error.message); });
  setInterval(function () { refresh().catch(function (error) { state(error.message); }); }, 5000);
  post({type:'terminal-ready',viewer:VIEWER,protocol:2,mode:VIEWER ? 'watch' : 'control',layout:VIEWER ? 'single' : 'grid'});
})();
</script>
</body>
</html>
